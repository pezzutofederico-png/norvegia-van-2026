/* Mood e meteo ridisegnano la vista: senza questo, il testo
   ancora non salvato nella textarea andrebbe perso. */
function grab(){
  var s=d();
  var e=s.journal[jDay]||{txt:'',km:''};
  var t=$('#jtxt'), k=$('#jkm');
  if(t) e.txt=t.value;
  if(k) e.km=k.value;
  e.ts=Date.now();          // serve alla fusione per sapere chi ha scritto per ultimo
  s.journal[jDay]=e;
  return e;
}

NQ.setMood=function(i){
  var e=grab();
  e.mood = e.mood===i? null : i;
  NQ.store.save(); NQ.renderJournal();
};
NQ.setWx=function(i){
  var e=grab();
  e.wx = e.wx===i? null : i;
  NQ.store.save(); NQ.renderJournal();
};

NQ.saveJournal=function(){
  grab();
  NQ.store.save();
  NQ.sync.programma();
  NQ.checkTrophies();
  NQ.renderHud();
  NQ.toast('Salvato','Giorno '+jDay+' aggiornato');
};

NQ.addPhotos=function(ev){
  var files=Array.prototype.slice.call(ev.target.files||[]);
  if(!files.length) return;
  var s=d(), day=jDay;
  NQ.toast('','Salvo '+files.length+(files.length===1?' foto…':' foto…'));

  /* La prima volta si chiede al browser di non buttare via i dati:
     senza, IndexedDB è sacrificabile quando lo spazio scarseggia. */
  NQ.persistStorage();

  files.reduce(function(chain,f){
    return chain.then(function(){
      return NQ.makeThumb(f).then(function(t){
        var rec={ id:NQ.uid(), day:day, ts:Date.now(),
                  blob:f, thumb:t.thumb, w:t.w, h:t.h,
                  bytes:f.size, name:f.name||'foto.jpg', type:f.type||'image/jpeg' };
        return NQ.photos.put(rec).then(function(){
          s.photos.push({ id:rec.id, day:day, ts:rec.ts, bytes:rec.bytes });
        });
      });
    });
  }, Promise.resolve()).then(function(){
    NQ.store.save();
    NQ.checkTrophies();
    NQ.renderHud();
    loadPhotos(day);
    NQ.toast('Fatto', files.length+' foto salvate a piena risoluzione');
  }).catch(function(err){
    NQ.toast('Non salvate', err.name==='QuotaExceededError'
      ? 'Spazio esaurito. Scarica l\'album e libera memoria.'
      : 'Errore: '+err.message);
  });
  ev.target.value='';
};

/* La griglia mostra le miniature. Gli originali restano in IndexedDB e
   escono solo nell'album o aprendo la foto a schermo intero. */
function loadPhotos(day){
  var host=$('#jphotos'); if(!host) return;
  var ids=d().photos.filter(function(p){return p.day===day;});
  if(!ids.length){ host.innerHTML=''; return; }
  Promise.all(ids.map(function(p){ return NQ.photos.get(p.id); })).then(function(recs){
    host.innerHTML = recs.filter(Boolean).map(function(r){
      var dim = r.w? r.w+'×'+r.h : '';
      var kb  = r.bytes? ' · '+Math.round(r.bytes/1024)+' KB' : '';
      return '<figure>'+
        '<button class="open" onclick="NQ.openPhoto(\''+r.id+'\')" '+
          'title="'+esc(dim+kb)+'" aria-label="Apri a piena risoluzione">'+
          '<img src="'+(r.thumb||r.url)+'" alt=""></button>'+
        (dim? '<figcaption>'+esc(dim)+'</figcaption>':'')+
        '<button class="del" onclick="NQ.delPhoto(\''+r.id+'\')" aria-label="Elimina">✕</button>'+
      '</figure>';
    }).join('');
  });
}

NQ.openPhoto=function(id){
  NQ.photos.get(id).then(function(r){
    if(!r) return;
    var url = r.blob? URL.createObjectURL(r.blob) : r.url;
    var w=window.open(url,'_blank');
    if(!w) NQ.toast('Bloccato','Il browser ha bloccato la finestra. Consenti i popup per aprire le foto.');
    if(r.blob) setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  });
};

NQ.delPhoto=function(id){
  var s=d();
  NQ.photos.del(id).then(function(){
    s.photos=s.photos.filter(function(p){return p.id!==id;});
    NQ.store.save();
    NQ.renderHud();
    loadPhotos(jDay);
    NQ.showStorage();
  });
};

/* Riga di stato dello spazio: su quindici giorni di foto a piena
   risoluzione è l'informazione che serve prima che sia troppo tardi. */
NQ.showStorage=function(){
  var host=$('#jstorage'); if(!host) return;
  var s=d();
  var mine=s.photos.reduce(function(a,p){ return a+(p.bytes||0); },0);
  NQ.storageInfo().then(function(info){
    var txt='<b>'+s.photos.length+'</b> foto · <b>'+(mine/1048576).toFixed(1)+' MB</b>';
    if(info && info.quota){
      var pct=Math.round(info.used/info.quota*100);
      txt += ' — usato '+(info.used/1048576).toFixed(0)+' MB di '+
             (info.quota/1073741824).toFixed(1)+' GB disponibili ('+pct+'%)';
      if(pct>80) txt += ' <b style="color:var(--red)">⚠ quasi pieno</b>';
    }
    host.innerHTML=txt;
  });
};

/* ============================================================
   TESORO — spese condivise
   Chi ha anticipato cosa, quanto spetta a ciascuno, e come si pareggia.
   Le spese fatte prima di partire stanno nel giorno 0.

   Ogni importo resta nella valuta in cui è stato inserito: quello che
   scegli qui sotto è solo come lo vuoi vedere.
   ============================================================ */

var splitSel = null;     // partecipanti selezionati nel modulo di inserimento
var expFilter = 'all';   // all | pre | trip

function dayLabel(n){ return n===0? 'Pre' : 'G'+n; }
function dayName(n){
  if(n===0) return 'Prima della partenza';
  var dd=dayByN(n);
  return 'Giorno '+n+' · '+dd.to;
}

function cur(){ return NQ.display(); }
function fmt(v){ return NQ.fmt(v); }
function altra(){ return cur()==='eur' ? 'nok' : 'eur'; }

NQ.setDisplay=function(c){
  if(!NQ.CUR[c]) return;
  d().display=c;
  NQ.store.save();
  NQ.renderMoney();
};

NQ.renderMoney=function(){
  var s=d(), people=s.people, C=cur();
  var tot=NQ.totale(s.exp);
  var pre=s.exp.filter(function(e){ return e.day===0; });
  var trip=s.exp.filter(function(e){ return e.day>0; });

  if(!splitSel) splitSel = people.map(function(p){ return p.id; });

  var h='';

  /* ---- valuta di visualizzazione ---- */
  h+='<div class="seg curseg">'+
       '<button class="'+(C==='eur'?'on':'')+'" onclick="NQ.setDisplay(\'eur\')">€ Euro</button>'+
       '<button class="'+(C==='nok'?'on':'')+'" onclick="NQ.setDisplay(\'nok\')">kr Corone</button>'+
     '</div>';

  /* ---- totale ---- */
  var elapsed = NQ.phase()==='pre'? 0 : NQ.phase()==='post'? 15 : Math.max(1,NQ.dayIndex()+1);
  h+='<div class="pxbox total">'+
       '<div class="amt money">'+fmt(tot)+'</div>'+
       '<div class="sub">'+
         (people.length>1? fmt(tot/people.length)+' a testa' : '')+
       '</div>'+
       (pre.length? '<div class="sub small">di cui '+fmt(NQ.totale(pre))+' spesi prima di partire</div>':'')+
       (elapsed&&trip.length? '<div class="sub small">'+fmt(NQ.totale(trip)/elapsed)+' al giorno in viaggio</div>':'')+
     '</div>';

  /* ---- budget ---- */
  if(s.budget){
    var bud=NQ.daNok(s.budget);      // il budget resta memorizzato in corone
    var left=bud-tot, pct=Math.max(0,Math.min(100,Math.round(tot/bud*100)));
    h+='<div class="pxbox"><div class="catrow">'+
         '<div class="cl"><span>Budget '+fmt(bud)+'</span>'+
         '<span class="money" style="color:'+(left<0?'var(--red)':'var(--green)')+'">'+
         (left<0? 'sforato di '+fmt(-left) : 'restano '+fmt(left))+'</span></div>'+
         '<div class="cbar"><div class="cfill" style="width:'+pct+'%;background:'+
         (left<0?'var(--red)':'var(--green)')+'"></div></div>'+
       '</div></div>';
  }

  /* ---- conti fra le persone ---- */
  if(people.length>1){
    var bal=NQ.balances(), moves=NQ.settle();
    h+='<div class="pxbox"><h3>Come siamo messi</h3><div class="bal">';
    bal.forEach(function(b){
      var cls = b.net>0.005? 'up' : b.net<-0.005? 'down' : '';
      h+='<div class="balrow">'+
           '<span class="bn">'+esc(b.name)+'</span>'+
           '<span class="bd">ha anticipato <b class="money">'+fmt(b.paid)+'</b> · gli spetta <b class="money">'+fmt(b.owed)+'</b></span>'+
           '<span class="bnet '+cls+' money">'+(b.net>0?'+':'')+fmt(b.net)+'</span>'+
         '</div>';
    });
    h+='</div>';

    if(!s.exp.length){
      h+='<p class="small muted" style="margin:12px 0 0">Registra la prima spesa e qui compare chi deve dare quanto a chi.</p>';
    } else if(!moves.length){
      h+='<div class="settled">✓ Siete pari. Nessuno deve niente a nessuno.</div>';
    } else {
      h+='<h4 class="mt">Per pareggiare</h4><div class="settle">';
      moves.forEach(function(m){
        h+='<div class="setrow">'+
             '<span class="sfrom">'+esc(m.from)+'</span>'+
             '<span class="sarr">→</span>'+
             '<span class="sto">'+esc(m.to)+'</span>'+
             '<span class="samt money">'+fmt(m.amt)+'</span>'+
           '</div>';
      });
      h+='</div>';
    }
    h+='</div>';
  }

  /* ---- grafico per categoria ---- */
  var byCat={};
  s.exp.forEach(function(e){ byCat[e.cat]=(byCat[e.cat]||0)+NQ.val(e); });
  var cats=Object.keys(NQ.CATS)
    .filter(function(k){ return byCat[k]; })
    .sort(function(a,b){ return byCat[b]-byCat[a]; });

  if(cats.length){
    var maxCat=byCat[cats[0]];
    h+='<div class="pxbox"><h3>Dove sono finiti i soldi</h3><div class="chart">';
    cats.forEach(function(k){
      var c=NQ.CATS[k], v=byCat[k];
      h+='<div class="crow">'+
           '<div class="cl"><span>'+c.icon+' '+esc(c.name)+'</span>'+
           '<span class="money">'+fmt(v)+' <s>'+Math.round(v/tot*100)+'%</s></span></div>'+
           '<div class="cbar"><div class="cfill" style="width:'+Math.max(2,Math.round(v/maxCat*100))+'%;background:'+c.color+'"></div></div>'+
         '</div>';
    });
    h+='</div></div>';
  }

  /* ---- grafico per giorno ---- */
  /* Una sola serie, un solo colore: con nove categorie i segmenti
     impilati diventerebbero indistinguibili per chi ha un deficit di
     visione dei colori, e non hanno etichette proprie. */
  if(s.exp.length){
    var byDay=[];
    for(var n=0;n<=15;n++){
      var list=s.exp.filter(function(e){ return e.day===n; });
      var per={};
      list.forEach(function(e){ per[e.cat]=(per[e.cat]||0)+NQ.val(e); });
      byDay.push({ n:n, tot:NQ.totale(list), per:per });
    }
    var maxDay=Math.max.apply(null, byDay.map(function(x){return x.tot;}).concat([0.01]));
    var peak=byDay.filter(function(x){ return x.tot===maxDay; })[0];

    h+='<div class="pxbox"><h3>Quanto è costato ogni giorno</h3><div class="daychart">';
    byDay.forEach(function(dd){
      var tip = dayName(dd.n)+' — '+fmt(dd.tot);
      var det = Object.keys(NQ.CATS).filter(function(k){ return dd.per[k]; })
        .map(function(k){ return NQ.CATS[k].name+' '+fmt(dd.per[k]); });
      if(det.length) tip += '\n'+det.join('\n');
      h+='<div class="dcol" title="'+esc(tip)+'">'+
           '<div class="dstack">'+
             (dd.tot? '<div class="dseg'+(dd.tot===maxDay?' top':'')+'" style="height:'+
                      Math.max(3,dd.tot/maxDay*100)+'%"></div>' : '')+
           '</div>'+
           '<div class="dlab'+(dd.n===0?' pre':'')+'">'+dayLabel(dd.n)+'</div>'+
         '</div>';
    });
    h+='</div><p class="small muted" style="margin:10px 0 0">'+
       (peak && peak.tot? 'Giornata più cara: <b>'+esc(dayName(peak.n))+'</b>, '+fmt(peak.tot)+'. ' : '')+
       'Tocca una colonna per il dettaglio per categoria.</p></div>';
  }

  /* ---- inserimento ---- */
  h+='<div class="pxbox"><h3>Aggiungi spesa</h3>'+
       '<div class="row">'+
         '<div style="flex:2"><label for="exLabel">Descrizione</label><input type="text" id="exLabel" placeholder="Es. traghetto Lavik"></div>'+
         '<div style="flex:1"><label for="exAmt">Importo</label><input type="number" step="0.01" id="exAmt" inputmode="decimal" placeholder="0"></div>'+
       '</div>'+
       '<div class="row mt">'+
         '<div><label for="exCur">Valuta pagata</label><select id="exCur">'+
           '<option value="eur"'+(C==='eur'?' selected':'')+'>€ euro</option>'+
           '<option value="nok"'+(C==='nok'?' selected':'')+'>kr corone</option>'+
         '</select></div>'+
         '<div><label for="exCat">Categoria</label><select id="exCat">';
  Object.keys(NQ.CATS).forEach(function(k){
    h+='<option value="'+k+'">'+NQ.CATS[k].icon+' '+esc(NQ.CATS[k].name)+'</option>';
  });
  h+='</select></div>'+
         '<div><label for="exDay">Quando</label><select id="exDay">'+
           '<option value="0">Prima di partire</option>';
  var curDay = NQ.dayIndex()>=0? NQ.DAYS[NQ.dayIndex()].n : (NQ.phase()==='pre'? 0 : 15);
  NQ.DAYS.forEach(function(dd){
    h+='<option value="'+dd.n+'"'+(dd.n===curDay?' selected':'')+'>G'+dd.n+' · '+esc(dd.to)+'</option>';
  });
  h+='</select></div>'+
       '</div>'+
       '<p class="small muted" style="margin:8px 0 0">La valuta è quella con cui hai <b>pagato davvero</b>. '+
       'L\'importo resta esattamente quello: non viene convertito e poi riconvertito.</p>';

  if(people.length>1){
    h+='<div class="row mt">'+
         '<div><label for="exPayer">Chi ha pagato</label><select id="exPayer">';
    people.forEach(function(p,i){
      h+='<option value="'+p.id+'"'+(i===0?' selected':'')+'>'+esc(p.name)+'</option>';
    });
    h+='</select></div></div>'+
       '<div class="mt"><label>Divisa tra</label><div class="moodrow" id="exSplit">';
    people.forEach(function(p){
      var on=splitSel.indexOf(p.id)>=0;
      h+='<button type="button" class="chip'+(on?' on':'')+'" data-p="'+p.id+'" '+
         'aria-pressed="'+on+'" onclick="NQ.toggleSplit(this)">'+esc(p.name)+'</button>';
    });
    h+='</div></div>';
  }

  h+='<button class="pxbtn go mt" onclick="NQ.addExpense()">+ Registra</button></div>';

  /* ---- sincronizzazione ---- */
  h+='<div class="pxbox"><h3>Sincronizzazione</h3>'+
       '<div class="syncrow" id="syncstate">'+NQ.sync.riga()+'</div>';

  if(NQ.sync.configurato()){
    h+='<div class="row mt">'+
         '<button class="pxbtn go" onclick="NQ.sync.ora()">🔄 Allinea adesso</button>'+
         '<button class="pxbtn" onclick="NQ.mostraInvito()">🔗 Invita</button>'+
       '</div>'+
       '<p class="small muted mt" style="margin-bottom:0">'+
       'Le modifiche partono da sole qualche secondo dopo che le fai, quando c\'è campo. '+
       'Senza rete resta tutto qui e si allinea al primo segnale. '+
       '<b>Le foto non si sincronizzano</b>: sono troppo pesanti, restano su questo dispositivo.</p>'+
       '<button class="pxbtn sm mt" onclick="NQ.scollegaSync()">Scollega questo dispositivo</button>';
  } else {
    h+='<p class="small muted mt">Non collegato. Spese e diario restano solo qui. '+

            return (people.filter(function(p){return p.id===id;})[0]||{}).name; }).join(', ')

  push(label||'Spesa',
       Math.round(amt*100)/100,
       valuta,

NQ.delPerson=function(id){
  var s=d();
  if(s.people.length<=1) return;
  var used=s.exp.filter(function(e){ return e.payer===id || e.split.indexOf(id)>=0; }).length;
  if(used){
    NQ.toast('Non si può', 'Questa persona compare in '+used+' spese. Cancellale o riassegnale prima.');
    return;
  }
  s.people=s.people.filter(function(p){ return p.id!==id; });
  splitSel=splitSel.filter(function(x){ return x!==id; });
  if(!splitSel.length) splitSel=s.people.map(function(p){ return p.id; });
  NQ.store.save(); NQ.renderMoney();
};

/* ---------- download ---------- */

function download(name, mime, text){
  var blob=new Blob([text],{type:mime});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); },2000);
}

/* ---------- helper ---------- */

function extOf(type, name){
  var m=/\.([a-z0-9]{2,5})$/i.exec(name||'');
  if(m) return m[1].toLowerCase();
  if(/png/.test(type))  return 'png';
  if(/heic/.test(type)) return 'heic';
  if(/webp/.test(type)) return 'webp';
  return 'jpg';
}

/* i vecchi record tenevano la foto come dataURL: qui torna binaria */
function dataURLtoBlob(url){
  var i=url.indexOf(','), head=url.slice(0,i);
  var bin=atob(url.slice(i+1));
  var u8=new Uint8Array(bin.length);
  for(var k=0;k<bin.length;k++) u8[k]=bin.charCodeAt(k);
  return new Blob([u8], { type:(/data:([^;]+)/.exec(head)||[,'image/jpeg'])[1] });
}

function photoBlob(r){
  return r.blob ? r.blob : r.url ? dataURLtoBlob(r.url) : null;
}

/* ---------- backup dei soli dati ---------- */

NQ.exportJSON=function(){
  var payload={
    app:'norge-quest', v:2, exported:new Date().toISOString(),

/* ---------- album completo ---------- */
/* Un .zip con dentro una pagina sfogliabile, le foto originali e i dati.
   Le foto a piena risoluzione dentro un singolo HTML in base64 farebbero
   centinaia di megabyte e nessun browser lo aprirebbe. */

NQ.exportZIP=function(){
  NQ.toast('','Preparo l\'album…');

  NQ.photos.all().then(function(recs){
    var s=NQ.store.d;
    recs.sort(function(a,b){ return (a.day-b.day) || (a.ts-b.ts); });

    var files=[], byDay={}, seq={};
    recs.forEach(function(r){
      var blob=photoBlob(r); if(!blob) return;
      seq[r.day]=(seq[r.day]||0)+1;
      var name='foto/g'+NQ.pad2(r.day)+'-'+seq[r.day]+'.'+extOf(r.type,r.name);
      files.push({ name:name, data:blob });
      (byDay[r.day]=byDay[r.day]||[]).push({ file:name, w:r.w, h:r.h });
    });

    files.push({ name:'index.html', data:albumHTML(s, byDay) });
    files.push({ name:'dati.json', data:JSON.stringify({
      app:'norge-quest', v:2, exported:new Date().toISOString(),
      state:s, foto:byDay
    }, null, 1) });

    return NQ.zipCreate(files).then(function(zip){
      var url=URL.createObjectURL(zip);
      var a=document.createElement('a');
      a.href=url; a.download='norvegia-2026-album.zip';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); },4000);
      NQ.toast('Album pronto',
        (files.length-2)+' foto · '+(zip.size/1048576).toFixed(1)+' MB. Scompattalo e apri index.html', true);
    });
  }).catch(function(e){
    NQ.toast('Non riuscito','Album non creato: '+e.message);
  });
};

    '<h1>Norvegia in van</h1><div class="sub">1 — 15 agosto 2026</div>'+
    '<div class="stats">'+
      '<div class="stat"><b>'+Object.keys(s.done).filter(function(k){return s.done[k];}).length+'</b><s>giorni</s></div>'+
      '<div class="stat"><b>'+Object.keys(s.trophies).length+'</b><s>trofei</s></div>'+
      '<div class="stat"><b>'+nFoto+'</b><s>foto</s></div>'+
      (totKm? '<div class="stat"><b>'+NQ.nok(totKm)+'</b><s>km</s></div>':'')+
      (tot?   '<div class="stat"><b>'+NQ.fmt(tot)+'</b><s>spesi</s></div>':'')+
    '</div></header><div class="w">';

  NQ.DAYS.forEach(function(day){
    var e=s.journal[day.n]||{}, ph=byDay[day.n]||[];
    if(!(e.txt||'').trim() && !ph.length) return;
    h+='<article><h2>Giorno '+day.n+' — '+esc(day.title)+'</h2>'+
       '<div class="meta">'+esc(day.from)+' → '+esc(day.to)+' · '+esc(day.date)+
       (e.mood!=null? ' · '+NQ.MOODS[e.mood]:'')+
       (e.wx!=null? ' '+NQ.WEATHER[e.wx]:'')+
       (e.km? ' · '+esc(e.km)+' km':'')+'</div>';
    h+= (e.txt||'').trim()? '<div class="entry">'+esc(e.txt)+'</div>'
                          : '<div class="entry none">Nessuna nota per questo giorno.</div>';
    if(ph.length){
      h+='<div class="ph">'+ph.map(function(p){
        return '<a href="'+p.file+'" target="_blank"><img src="'+p.file+'" alt="Giorno '+day.n+'" loading="lazy"></a>';
      }).join('')+'</div>';
    }
    h+='</article>';
  });

  /* i conti, così l'album è anche il rendiconto */
  if(s.exp.length){
    var byCat={};
    s.exp.forEach(function(x){ byCat[x.cat]=(byCat[x.cat]||0)+NQ.val(x); });
    h+='<article><h2>I conti</h2><table>';
    Object.keys(NQ.CATS).forEach(function(k){
      if(!byCat[k]) return;
      h+='<tr><td>'+NQ.CATS[k].icon+' '+esc(NQ.CATS[k].name)+'</td><td>'+NQ.fmt(byCat[k])+'</td></tr>';
    });
    h+='<tr><td><b>Totale</b></td><td><b>'+NQ.fmt(tot)+'</b></td></tr></table>';

    if(s.people && s.people.length>1){
      h+='<table>';
      NQ.balances().forEach(function(b){
        h+='<tr><td>'+esc(b.name)+' ha anticipato</td><td>'+NQ.fmt(b.paid)+'</td></tr>';
      });
      h+='</table>';
    }
    h+='</article>';
  }

  return h+'</div><footer>Generato da Norge Quest · '+new Date().toLocaleDateString('it-IT')+'</footer></body></html>';
}

/* ---------- ripristino ---------- */

NQ.importBackup=function(ev){
  var f=(ev.target.files||[])[0];
  ev.target.value='';
  if(!f) return;
  var isZip=/\.zip$/i.test(f.name) || f.type==='application/zip';
  (isZip? restoreZip(f) : restoreJson(f)).catch(function(e){
    NQ.toast('Non ripristinato', e.message);
  });
};

function applyState(state, photos){
  if(!confirm('Ripristinare questo backup?\n\nI dati attualmente su questo dispositivo verranno sostituiti.'))
    return Promise.resolve(false);
  NQ.store.d=state;
  NQ.store.save();
  NQ.store.load();     // rilegge dal salvataggio applicando le migrazioni di versione
  return NQ.photos.clear()
    .then(function(){ return (photos||[]).reduce(function(c,r){
      return c.then(function(){ return NQ.photos.put(r); });
    }, Promise.resolve()); })
    .then(function(){
      NQ.chip.setMute(NQ.store.d.mute);
      NQ.renderHud();
      NQ.go('journal');
      NQ.toast('Ripristinato', (photos||[]).length+' foto recuperate');
      return true;
    });
}

function restoreJson(f){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){ rej(new Error('lettura fallita')); };
    fr.onload=function(){
      var p;
      try{ p=JSON.parse(fr.result); }
      catch(e){ return rej(new Error('il file non è un backup valido')); }
      if(!p || p.app!=='norge-quest' || !p.state)
        return rej(new Error('non è un backup di Norge Quest'));
      res(applyState(p.state, (p.photos||[]).map(function(r){
        return r.url && !r.blob ? { id:r.id, day:r.day, ts:r.ts, blob:dataURLtoBlob(r.url) } : r;
      })));
    };
    fr.readAsText(f);
  });
}

function restoreZip(f){
  return NQ.zipRead(f).then(function(entries){
    var dati=entries.filter(function(e){ return /(^|\/)dati\.json$/.test(e.name); })[0];
    if(!dati) throw new Error('nell\'archivio non c\'è dati.json');

    var txt = window.TextDecoder? new TextDecoder('utf-8').decode(dati.data)
                                : String.fromCharCode.apply(null, dati.data);
    var p=JSON.parse(txt);
    if(!p.state) throw new Error('archivio senza stato salvato');

    /* si ricostruisce l'associazione foto → giorno dalla mappa salvata */
    var wanted={};
    Object.keys(p.foto||{}).forEach(function(day){
      (p.foto[day]||[]).forEach(function(x){ wanted[x.file]={ day:+day, w:x.w, h:x.h }; });
    });

    var photos=[];
    entries.forEach(function(e){
      var meta=wanted[e.name];
      if(!meta) return;
      var type = /\.png$/i.test(e.name)? 'image/png'
               : /\.webp$/i.test(e.name)? 'image/webp'
               : /\.heic$/i.test(e.name)? 'image/heic' : 'image/jpeg';
      var blob=new Blob([e.data.slice()], { type:type });
      photos.push({ id:NQ.uid(), day:meta.day, ts:Date.now(),
                    blob:blob, w:meta.w, h:meta.h, bytes:blob.size,
                    name:e.name.split('/').pop(), type:type });
    });

    /* i metadati nello stato devono puntare alle foto appena reinserite */
    p.state.photos = photos.map(function(r){
      return { id:r.id, day:r.day, ts:r.ts, bytes:r.bytes };
    });

    return rebuildThumbs(photos).then(function(){ return applyState(p.state, photos); });
  });
}

/* le miniature non stanno nell'archivio: si rigenerano al volo */
function rebuildThumbs(photos){
  return photos.reduce(function(chain,r){
    return chain.then(function(){
      return NQ.makeThumb(r.blob).then(function(t){
        r.thumb=t.thumb; if(!r.w){ r.w=t.w; r.h=t.h; }
      }).catch(function(){ /* una miniatura persa non blocca il ripristino */ });
    });
  }, Promise.resolve());
}

NQ.wipe=function(){
  if(!confirm('Cancellare diario, foto, spese e trofei da questo dispositivo?\n\nNon si torna indietro. Se non hai un backup, annulla e fallo prima.')) return;
  NQ.store.reset().then(function(){
    NQ.renderHud();
    NQ.go('map');
    NQ.toast('Cancellato','Si riparte da zero');
  });
};

/* ============================================================
   AVVIO
   ============================================================ */

function boot(){
  NQ.store.load();
  NQ.chip.muted = NQ.store.d.mute!==false;

  NQ.$$('#tabs button').forEach(function(b){
    b.addEventListener('click', function(){ NQ.go(b.dataset.v); });
  });
  $('#muteBtn').addEventListener('click', NQ.toggleMute);

  NQ.checkTrophies();
  NQ.renderHud();

  var ph=NQ.phase(), idx=NQ.dayIndex();
  NQ.go('map');

  /* in viaggio si apre direttamente sul giorno corrente */
  if(ph==='live' && idx>=0){
    setTimeout(function(){ NQ.openDay(NQ.DAYS[idx].n); }, 400);
  }

  if(!NQ.store.d.seen){
    NQ.store.d.seen=true; NQ.store.save();
    setTimeout(function(){
      NQ.toast('Norge Quest',
        ph==='pre'? 'Mancano '+NQ.daysTo(NQ.TRIP.start)+' giorni. Tocca un nodo sulla mappa per il briefing di quella tappa.'
                  : 'Tocca un nodo sulla mappa per aprire la tappa.', true);
    },700);
  }

  /* il browser scarica la pagina in background: fermiamo l'animazione */
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ NQ.map.stop(); NQ.chip.stop(); }
    else {
      if($('#v-map').classList.contains('active')){
        NQ.map.start();
        if(!NQ.store.d.mute) NQ.chip.play(NQ.chip.trackName||'route');
      }
      /* tornando sull'app conviene ricontrollare: l'altro può aver
         scritto qualcosa mentre eri altrove */
      NQ.sync.ora(true);
    }
  });

  /* All'apertura si prova ad allinearsi, in silenzio: se non c'è rete
     non deve succedere niente di visibile. */
  if(NQ.sync.configurato()) setTimeout(function(){ NQ.sync.ora(true); }, 1200);

  addEventListener('online',  function(){ NQ.sync.ora(true); });
  addEventListener('offline', function(){ NQ.sync.aggiornaUI(); });

  /* chiudere la finestra modale cliccando fuori o con Esc */
  var modal=$('#modal');
  if(modal) modal.addEventListener('click', function(e){
    if(e.target===modal) NQ.chiudiModal();
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && modal && modal.classList.contains('open')) NQ.chiudiModal();
  });
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();

})();

</script>
