<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1622">
<meta name="description" content="Compagno di viaggio per 15 giorni in van in Norvegia, 1-15 agosto 2026. Funziona offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Norge Quest — Norvegia in van</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230b1622'/><rect x='2' y='6' width='12' height='5' fill='%23f5c542'/><rect x='3' y='11' width='2' height='2' fill='%23dbe9f7'/><rect x='11' y='11' width='2' height='2' fill='%23dbe9f7'/></svg>">
<style>
/* ============================================================
   NORGE QUEST — STYLE
   Pixel / Game Boy Color. Niente raggi, niente gradienti morbidi,
   bordi netti costruiti con box-shadow a gradini.
   ============================================================ */

:root{
  --bg:#0b1622;
  --bg2:#0f1e2e;
  --panel:#16283d;
  --panel2:#1d3550;
  --panel-lo:#122335;
  --panel-hi:#22405f;
  --line:#2e5580;
  --line-hi:#4a80bd;
  --ink:#dbe9f7;
  --ink-dim:#7d97b3;
  --ink-faint:#546b83;
  --green:#7fdb6a;
  --green-d:#3f8f38;
  --gold:#f5c542;
  --gold-d:#a8801a;
  --red:#e8544b;
  --red-d:#96261f;
  --blue:#4a9de8;
  --purple:#a367d6;
  --px:4px;
  --font:"Lucida Console","DejaVu Sans Mono",Consolas,"Courier New",monospace;
}

*{ box-sizing:border-box; }

html,body{
  margin:0; padding:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:14px;
  line-height:1.55;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}

body{
  padding-bottom:76px;             /* spazio per la tab bar */
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px);
}

img,canvas{ image-rendering:pixelated; image-rendering:crisp-edges; max-width:100%; }

button,input,textarea,select{ font-family:inherit; font-size:inherit; color:inherit; }

::selection{ background:var(--gold); color:#111; }

/* ---------- scaffolding pixel ---------- */

.pxbox{
  background:var(--panel);
  border:0;
  box-shadow:
    0 0 0 var(--px) var(--line),
    inset 0 var(--px) 0 rgba(255,255,255,.07),
    inset 0 calc(var(--px) * -1) 0 rgba(0,0,0,.35);
  padding:14px;
  margin:0 0 14px;
}
.pxbox.lo{ background:var(--panel-lo); }

.pxbtn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  min-height:44px; padding:9px 15px;
  background:var(--panel-hi);
  border:0; cursor:pointer;
  color:var(--ink);
  text-transform:uppercase; letter-spacing:.09em; font-size:12px; font-weight:700;
  box-shadow:
    0 0 0 3px var(--line-hi),
    inset 0 3px 0 rgba(255,255,255,.16),
    inset 0 -3px 0 rgba(0,0,0,.4);
  transition:transform .06s steps(2), background .12s;
}
.pxbtn:hover{ background:#2b5177; }
.pxbtn:active{ transform:translateY(3px); box-shadow:0 0 0 3px var(--line-hi), inset 0 -2px 0 rgba(0,0,0,.4); }
.pxbtn.go{ background:var(--green-d); box-shadow:0 0 0 3px var(--green), inset 0 3px 0 rgba(255,255,255,.2), inset 0 -3px 0 rgba(0,0,0,.4); }
.pxbtn.go:hover{ background:#4aa842; }
.pxbtn.warn{ background:var(--red-d); box-shadow:0 0 0 3px var(--red), inset 0 3px 0 rgba(255,255,255,.18), inset 0 -3px 0 rgba(0,0,0,.4); }
.pxbtn.sm{ min-height:34px; padding:5px 10px; font-size:11px; box-shadow:0 0 0 2px var(--line-hi), inset 0 2px 0 rgba(255,255,255,.14); }

input[type=text],input[type=number],input[type=date],textarea,select{
  width:100%; padding:10px 11px; min-height:44px;
  background:var(--bg2); color:var(--ink);
  border:0; outline:0;
  box-shadow:inset 0 0 0 3px var(--line);
}
input:focus,textarea:focus,select:focus{ box-shadow:inset 0 0 0 3px var(--gold); }
textarea{ resize:vertical; min-height:110px; line-height:1.6; }
label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.1em;
       color:var(--ink-dim); margin:0 0 5px; }

h1,h2,h3,h4{ margin:0 0 10px; line-height:1.25; font-weight:700; }
h2{ font-size:17px; letter-spacing:.04em; }
h3{ font-size:14px; text-transform:uppercase; letter-spacing:.11em; color:var(--gold); }
h4{ font-size:13px; color:var(--ink); }
p{ margin:0 0 11px; }
b,strong{ color:#fff; }
a{ color:var(--blue); }
hr{ border:0; height:3px; background:var(--line); margin:16px 0; }

/* ---------- HUD ---------- */

#hud{
  position:sticky; top:0; z-index:60;
  background:var(--bg2);
  box-shadow:0 4px 0 var(--line), 0 5px 0 rgba(0,0,0,.5);
  padding:8px 12px;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
#hud .lvl{
  font-size:11px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--gold); white-space:nowrap; font-weight:700;
}
#hud .xpwrap{ flex:1 1 110px; min-width:80px; }
#hud .xpbar{
  height:14px; background:#08111b; box-shadow:inset 0 0 0 3px var(--line);
  position:relative; overflow:hidden;
}
#hud .xpfill{
  height:100%; width:0;
  background:repeating-linear-gradient(90deg,var(--green) 0 6px,var(--green-d) 6px 12px);
  transition:width .6s steps(12);
}
#hud .stat{ font-size:11px; color:var(--ink-dim); white-space:nowrap; }
#hud .stat b{ color:var(--ink); }
#hud .hbtns{ display:flex; gap:6px; margin-left:auto; }
.iconbtn{
  width:38px; height:38px; display:grid; place-items:center;
  background:var(--panel); border:0; cursor:pointer; font-size:16px;
  box-shadow:0 0 0 3px var(--line), inset 0 2px 0 rgba(255,255,255,.09);
}
.iconbtn.on{ background:var(--green-d); box-shadow:0 0 0 3px var(--green); }

/* ---------- layout ---------- */

.wrap{ max-width:900px; margin:0 auto; padding:14px 12px 20px; }
.view{ display:none; animation:fadein .22s steps(4); }
.view.active{ display:block; }
@keyframes fadein{ from{opacity:0} to{opacity:1} }

/* ---------- tab bar ---------- */

#tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:70;
  display:grid; grid-template-columns:repeat(6,1fr);
  background:var(--bg2);
  box-shadow:0 -4px 0 var(--line), 0 -5px 0 rgba(0,0,0,.5);
}
#tabs button{
  background:none; border:0; cursor:pointer; padding:7px 1px 8px;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  color:var(--ink-faint); font-size:8px; letter-spacing:.02em;
  text-transform:uppercase; min-height:58px; justify-content:center;
  overflow:hidden;
}
#tabs button .ti{ font-size:18px; line-height:1; }
@media(min-width:400px){
  #tabs button{ font-size:9px; letter-spacing:.05em; }
}
#tabs button.active{ color:var(--gold); background:var(--panel-lo);
  box-shadow:inset 0 4px 0 var(--gold); }

/* ---------- mappa ---------- */

#mapwrap{
  position:relative; background:#08131f;
  box-shadow:0 0 0 var(--px) var(--line);
  overflow:auto; margin-bottom:14px;
  max-height:70vh;
}
#mapcanvas{ display:block; margin:0 auto; cursor:pointer; touch-action:pan-x pan-y; }

.maplegend{
  display:flex; gap:12px; flex-wrap:wrap; justify-content:center;
  font-size:10px; color:var(--ink-dim); margin:-6px 0 14px;
  text-transform:uppercase; letter-spacing:.07em;
}
.maplegend i{ display:inline-block; width:9px; height:9px; margin-right:4px;
  vertical-align:-1px; font-style:normal; }

/* ---------- countdown ---------- */

.cdown{ text-align:center; padding:22px 14px; }
.cdown .big{
  font-size:52px; font-weight:700; color:var(--gold); line-height:1;
  letter-spacing:.02em;
  text-shadow:0 4px 0 var(--gold-d), 0 8px 0 rgba(0,0,0,.4);
}
.cdown .lab{ font-size:12px; text-transform:uppercase; letter-spacing:.22em;
  color:var(--ink-dim); margin-top:10px; }

/* ---------- lista giorni ---------- */

.daylist{ display:grid; gap:10px; }
.daycard{
  display:flex; gap:12px; align-items:stretch; cursor:pointer;
  background:var(--panel); padding:11px 12px; text-align:left; border:0; width:100%;
  box-shadow:0 0 0 3px var(--line), inset 0 3px 0 rgba(255,255,255,.05);
  transition:transform .07s steps(2);
}
.daycard:hover{ transform:translateX(4px); box-shadow:0 0 0 3px var(--line-hi), inset 0 3px 0 rgba(255,255,255,.08); }
.daycard.today{ box-shadow:0 0 0 3px var(--gold), inset 0 3px 0 rgba(255,255,255,.12); background:#1e2f3f; }
.daycard.done{ opacity:.62; }
.daycard .dn{
  flex:0 0 44px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--bg2); box-shadow:inset 0 0 0 3px var(--line);
}
.daycard .dn i{ font-style:normal; font-size:19px; font-weight:700; color:var(--gold); }
.daycard .dn s{ text-decoration:none; font-size:9px; color:var(--ink-faint); }
.daycard .dbody{ flex:1; min-width:0; }
.daycard .dt{ font-weight:700; color:#fff; font-size:14px; }
.daycard .dr{ font-size:11px; color:var(--ink-dim); margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.daycard .dtag{ display:inline-block; font-size:9px; padding:2px 6px; margin-top:5px;
  text-transform:uppercase; letter-spacing:.09em; background:var(--panel-hi); color:var(--ink-dim); }
.daycard .dchk{ flex:0 0 26px; display:grid; place-items:center; font-size:18px; }

/* ---------- dettaglio giorno ---------- */

.dayhead{ background:var(--panel-lo); padding:16px 14px; margin-bottom:14px;
  box-shadow:0 0 0 var(--px) var(--line); }
.dayhead .kicker{ font-size:10px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--gold); }
.dayhead h2{ margin:5px 0 4px; font-size:21px; color:#fff; }
.dayhead .route{ color:var(--ink-dim); font-size:12px; }

.factgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:8px;
  margin:14px 0; }
.fact{ background:var(--bg2); padding:9px 10px; box-shadow:inset 0 0 0 3px var(--line); }
.fact s{ display:block; text-decoration:none; font-size:9px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-faint); }
.fact b{ display:block; font-size:15px; color:var(--ink); margin-top:3px; }
.fact.alert b{ color:var(--red); }

.tip{ display:flex; gap:10px; padding:9px 0; border-bottom:2px solid var(--panel-hi); }
.tip:last-child{ border-bottom:0; }
.tip .ic{ flex:0 0 22px; font-size:15px; line-height:1.4; }
.tip .tx{ flex:1; font-size:13px; color:var(--ink); }

.bars{ display:flex; gap:3px; }
.bars i{ width:15px; height:9px; background:var(--panel-hi); font-style:normal; }
.bars i.on{ background:var(--gold); }
.bars.risk i.on{ background:var(--red); }

ul.acts{ margin:0; padding-left:18px; }
ul.acts li{ margin-bottom:5px; }

.warnbox{ background:#3a1e17; box-shadow:0 0 0 3px var(--red);
  padding:11px 12px; margin:12px 0; font-size:13px; }
.warnbox b{ color:var(--red); }

/* ---------- boss ---------- */

.bossgrid{ display:grid; gap:12px; }
.bosscard{
  cursor:pointer; text-align:left; border:0; width:100%; padding:0;
  background:var(--panel); box-shadow:0 0 0 3px var(--line);
  display:flex; flex-direction:column;
}
.bosscard .bh{ padding:13px 14px; background:linear-gradient(180deg,#2a1a2e,#1a1420);
  box-shadow:inset 0 -3px 0 var(--line); }
.bosscard .bh .bn{ font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--red); }
/* le camminate portano il verde: si distinguono dai boss a colpo d'occhio */
.bosscard.walk .bh{ background:linear-gradient(180deg,#1b2e22,#141d18); }
.bosscard.walk .bh .bn{ color:var(--green); }
.bosscard .bh h3{ margin:4px 0 3px; color:#fff; font-size:19px; text-transform:none; letter-spacing:0; }
.bosscard .bh .bs{ font-size:11px; color:var(--ink-dim); }
.bosscard .bb{ padding:11px 14px; display:flex; gap:16px; flex-wrap:wrap; font-size:11px;
  color:var(--ink-dim); align-items:center; }
.bosscard .bb b{ color:var(--ink); }

.chain{ display:grid; gap:8px; }
.chain .ci{ display:flex; gap:10px; align-items:flex-start; font-size:13px; }
.chain .ci .cl{ flex:0 0 92px; font-size:10px; text-transform:uppercase;
  letter-spacing:.09em; color:var(--gold); padding-top:3px; }

/* ---------- diario ---------- */

.moodrow{ display:flex; gap:7px; flex-wrap:wrap; }
.moodrow button{ width:46px; height:46px; font-size:22px; background:var(--bg2);
  border:0; cursor:pointer; box-shadow:inset 0 0 0 3px var(--line); }
.moodrow button.on{ box-shadow:inset 0 0 0 3px var(--gold); background:var(--panel-hi); }

.photos{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:7px; margin-top:10px; }
.photos figure{ margin:0; position:relative; overflow:hidden;
  box-shadow:0 0 0 3px var(--line); background:var(--bg2); }
.photos .open{ display:block; width:100%; aspect-ratio:1; padding:0; border:0;
  background:none; cursor:zoom-in; }
.photos img{ width:100%; height:100%; object-fit:cover; image-rendering:auto; display:block; }
.photos figcaption{ font-size:9px; text-align:center; padding:3px 2px;
  color:var(--ink-faint); background:var(--bg2); font-variant-numeric:tabular-nums; }
.photos .del{ position:absolute; top:2px; right:2px; width:26px; height:26px;
  background:rgba(0,0,0,.78); color:#fff; border:0; cursor:pointer; font-size:13px; line-height:1; }

.storagebar{ margin-top:10px; padding:8px 10px; font-size:11px; color:var(--ink-dim);
  background:var(--bg2); box-shadow:inset 0 0 0 2px var(--line); }
.storagebar:empty{ display:none; }

.jnav{ display:flex; gap:6px; align-items:center; margin-bottom:12px; }
.jnav select{ flex:1; }

/* ---------- spese ---------- */

.money{ font-variant-numeric:tabular-nums; }
.total{ text-align:center; padding:16px 12px; }
.total .amt{ font-size:38px; font-weight:700; color:var(--gold); line-height:1;
  text-shadow:0 4px 0 var(--gold-d); }
.total .sub{ font-size:12px; color:var(--ink-dim); margin-top:8px; }

.catrow{ margin-bottom:9px; }
.catrow .cl,.crow .cl{ display:flex; justify-content:space-between; gap:10px;
  font-size:12px; margin-bottom:3px; }
.catrow .cbar,.crow .cbar{ height:13px; background:#08111b; box-shadow:inset 0 0 0 2px var(--line); }
.catrow .cfill,.crow .cfill{ height:100%; width:0; transition:width .5s steps(10); }

/* ---------- grafici ---------- */

.chart{ display:grid; gap:10px; }
.chart .cl span:last-child{ white-space:nowrap; }
.chart .cl s{ text-decoration:none; color:var(--ink-faint); margin-left:5px; }

/* colonne per giorno: una sola serie, un solo colore */
.daychart{ display:flex; gap:2px; align-items:stretch; height:132px; }
.daychart .dcol{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:4px;
  cursor:help; }
.daychart .dstack{ flex:1; display:flex; flex-direction:column; justify-content:flex-end;
  background:#08111b; box-shadow:inset 0 0 0 2px var(--line); padding:2px; }
.daychart .dseg{ width:100%; min-height:3px; background:#3987e5; }
.daychart .dseg.top{ background:var(--gold); }
.daychart .dcol:hover .dseg{ background:#7fb4f0; }
.daychart .dcol:hover .dseg.top{ background:#ffd970; }
.daychart .dlab{ font-size:9px; text-align:center; color:var(--ink-faint);
  font-variant-numeric:tabular-nums; }
.daychart .dlab.pre{ color:var(--gold); }

/* ---------- conti condivisi ---------- */

.bal{ display:grid; gap:6px; }
.balrow{ display:grid; grid-template-columns:1fr auto; gap:2px 10px; align-items:baseline;
  padding:9px 11px; background:var(--bg2); box-shadow:inset 0 0 0 2px var(--line); }
.balrow .bn{ font-weight:700; color:#fff; }
.balrow .bd{ grid-column:1; font-size:11px; color:var(--ink-dim); }
.balrow .bnet{ grid-row:1 / span 2; grid-column:2; font-size:17px; font-weight:700;
  color:var(--ink-dim); white-space:nowrap; }
.balrow .bnet.up{ color:var(--green); }
.balrow .bnet.down{ color:var(--red); }

.settled{ margin-top:12px; padding:11px 12px; background:#16301f;
  box-shadow:0 0 0 3px var(--green); font-size:13px; color:var(--green); }

.settle{ display:grid; gap:6px; }
.setrow{ display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  padding:10px 12px; background:#2a2417; box-shadow:0 0 0 3px var(--gold); font-size:13px; }
.setrow .sfrom{ font-weight:700; color:var(--red); }
.setrow .sarr{ color:var(--gold); font-weight:700; }
.setrow .sto{ font-weight:700; color:var(--green); }
.setrow .samt{ margin-left:auto; font-weight:700; color:#fff; white-space:nowrap; }
.setrow .samt s{ text-decoration:none; color:var(--ink-dim); font-weight:400; font-size:11px; }

/* ---------- filtro segmentato ---------- */

.seg{ display:flex; gap:4px; margin-bottom:10px; flex-wrap:wrap; }
.seg button{ flex:1; min-width:90px; min-height:38px; padding:6px 8px; font-size:11px;
  background:var(--bg2); border:0; cursor:pointer; color:var(--ink-dim);
  box-shadow:inset 0 0 0 2px var(--line); }
.seg button.on{ color:var(--gold); box-shadow:inset 0 0 0 2px var(--gold); background:var(--panel-hi); }

/* selettore della valuta di visualizzazione: sta in cima al Tesoro
   perché cambia la lettura di tutto quello che c'è sotto */
.seg.curseg{ margin-bottom:14px; }
.seg.curseg button{ min-height:44px; font-size:13px; font-weight:700; letter-spacing:.04em; }
.seg button s{ text-decoration:none; opacity:.65; }

/* ---------- sincronizzazione ---------- */

.syncrow{ display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:10px 11px; background:var(--bg2); box-shadow:inset 0 0 0 2px var(--line);
  font-size:12px; }
.syncrow s{ text-decoration:none; color:var(--ink-faint); font-size:10px; }
.sdot{ width:10px; height:10px; flex:0 0 10px; background:var(--ink-faint); }
.sdot.ok{ background:var(--green); }
.sdot.bad{ background:var(--red); }
.sdot.warn{ background:var(--gold); }
.sdot.off{ background:var(--ink-faint); }
.sdot.busy{ background:var(--blue); animation:blink .8s steps(2) infinite; }
@keyframes blink{ 50%{ opacity:.25 } }

pre.code{ background:#08111b; box-shadow:inset 0 0 0 2px var(--line);
  padding:11px 12px; overflow-x:auto; font-size:11px; line-height:1.5;
  color:var(--green); margin:10px 0; }

/* ---------- persone ---------- */

.moodrow button.chip{ width:auto; min-width:74px; padding:0 14px; font-size:12px;
  font-weight:700; color:var(--ink-dim); }
.moodrow button.chip.on{ color:var(--gold); }

.peoplelist{ display:grid; gap:6px; }
.prow{ display:flex; gap:6px; align-items:center; }
.prow input{ flex:1; }

.exrow .en s{ display:block; text-decoration:none; font-size:10px; color:var(--ink-faint); }

.preset{ display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }
.preset button{ font-size:11px; padding:7px 9px; min-height:38px; background:var(--bg2);
  border:0; cursor:pointer; color:var(--ink-dim); box-shadow:inset 0 0 0 2px var(--line); }
.preset button:hover{ color:var(--ink); box-shadow:inset 0 0 0 2px var(--gold); }

.exlist{ display:grid; gap:5px; margin-top:12px; }
.exrow{ display:flex; gap:9px; align-items:center; padding:8px 10px; background:var(--bg2);
  box-shadow:inset 0 0 0 2px var(--line); font-size:12px; }
.exrow .ei{ font-size:15px; }
.exrow .en{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.exrow .ea{ font-weight:700; white-space:nowrap; }
.exrow .ed{ font-size:10px; color:var(--ink-faint); white-space:nowrap; }
.exrow .ex{ background:none; border:0; color:var(--ink-faint); cursor:pointer;
  font-size:15px; padding:2px 4px; }
.exrow .ex:hover{ color:var(--red); }

/* ---------- guida ---------- */

.acc{ margin-bottom:9px; }
.acc>summary{
  cursor:pointer; list-style:none; padding:13px 14px;
  background:var(--panel); box-shadow:0 0 0 3px var(--line);
  display:flex; align-items:center; gap:11px;
  font-weight:700; font-size:14px;
}
.acc>summary::-webkit-details-marker{ display:none; }
.acc>summary::after{ content:'▾'; margin-left:auto; color:var(--gold); }
.acc[open]>summary::after{ content:'▴'; }
.acc>summary .gi{ font-size:19px; }
.acc .accb{ padding:14px; background:var(--panel-lo); box-shadow:0 0 0 3px var(--line);
  margin-top:3px; font-size:13px; }
.acc .accb p{ margin-bottom:12px; }
.acc .accb p:last-child{ margin-bottom:0; }

table.ph{ width:100%; border-collapse:collapse; font-size:13px; }
table.ph td{ padding:7px 8px; border-bottom:2px solid var(--panel-hi); vertical-align:top; }
table.ph td:first-child{ color:var(--gold); font-weight:700; white-space:nowrap; }
table.ph td:last-child{ color:var(--ink-dim); }

/* ---------- trofei ---------- */

.trophies{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:9px; }
.trophy{ text-align:center; padding:11px 6px; background:var(--bg2);
  box-shadow:inset 0 0 0 3px var(--line); opacity:.3; filter:grayscale(1); }
.trophy.got{ opacity:1; filter:none; box-shadow:inset 0 0 0 3px var(--gold); background:var(--panel); }
.trophy .tic{ font-size:26px; line-height:1.2; }
.trophy .tn{ font-size:10px; font-weight:700; margin-top:5px; color:var(--ink); }
.trophy .td{ font-size:9px; color:var(--ink-faint); margin-top:2px; line-height:1.35; }

/* ---------- toast ---------- */

#toast{ position:fixed; left:50%; bottom:88px; transform:translateX(-50%);
  z-index:90; display:flex; flex-direction:column; gap:7px; align-items:center;
  pointer-events:none; width:calc(100% - 24px); max-width:400px; }
.toastmsg{ background:var(--panel-hi); padding:11px 15px; font-size:12px;
  box-shadow:0 0 0 3px var(--gold); text-align:center;
  animation:pop .3s steps(4); }
.toastmsg.big{ font-size:14px; }
.toastmsg .tt{ color:var(--gold); font-weight:700; display:block; font-size:11px;
  text-transform:uppercase; letter-spacing:.13em; margin-bottom:3px; }
@keyframes pop{ from{ transform:translateY(14px); opacity:0 } to{ transform:none; opacity:1 } }

#confetti{ position:fixed; inset:0; pointer-events:none; z-index:85; display:none; }

/* ---------- misc ---------- */

.muted{ color:var(--ink-dim); }
.small{ font-size:11px; }
.center{ text-align:center; }
.row{ display:flex; gap:9px; flex-wrap:wrap; }
.row>*{ flex:1; min-width:0; }
.mt{ margin-top:14px; }
.srcnote{ font-size:10px; color:var(--ink-faint); line-height:1.6; }

.modal{ position:fixed; inset:0; z-index:95; background:rgba(4,10,17,.9);
  display:none; overflow-y:auto; padding:14px; }
.modal.open{ display:block; }
.modal .mbox{ max-width:640px; margin:24px auto; background:var(--panel);
  box-shadow:0 0 0 var(--px) var(--line-hi); padding:18px; }

/* ---------- desktop ---------- */

@media(min-width:720px){
  body{ font-size:15px; padding-bottom:0; }
  #tabs{ position:sticky; top:0; bottom:auto; grid-template-columns:repeat(6,1fr);
    max-width:900px; margin:0 auto; box-shadow:0 4px 0 var(--line); }
  #hud{ position:static; }
  .wrap{ padding:18px 16px 40px; }
  .daycard .dr{ font-size:12px; }
  .cdown .big{ font-size:76px; }
}

/* ---------- focus da tastiera ---------- */
/* Il focus non deve dipendere dal solo colore: qui è un anello
   pieno, coerente con i bordi netti del resto dell'interfaccia. */

:focus{ outline:none; }
.pxbtn:focus-visible,
.iconbtn:focus-visible,
.daycard:focus-visible,
.bosscard:focus-visible,
.moodrow button:focus-visible,
.preset button:focus-visible,
.exrow .ex:focus-visible,
.photos .del:focus-visible,
.acc>summary:focus-visible,
#tabs button:focus-visible{
  outline:4px solid var(--gold);
  outline-offset:3px;
  position:relative; z-index:5;
}
input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:4px solid var(--gold); outline-offset:2px;
}
/* il file input è nascosto dentro una label che fa da pulsante */
label.pxbtn:focus-within{ outline:4px solid var(--gold); outline-offset:3px; }

/* ---------- accessibilità movimento ---------- */

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001s !important;
    transition-duration:.001s !important;
  }
}

</style>

  return String(s==null?'':s).replace(/[&<>"']/g,function(c){

/* Disegna testo bitmap. Ritorna la larghezza in pixel logici. */
NQ.drawText = function(ctx,text,x,y,px,color,shadow){
  text=String(text).toUpperCase();
  var cx=x;
  for(var i=0;i<text.length;i++){
    var g=FONT[text[i]] || FONT[' '];
    for(var r=0;r<7;r++) for(var c=0;c<5;c++){
      if(g[r][c]!=='#') continue;
      if(shadow){
        ctx.fillStyle=shadow;
        ctx.fillRect(cx+c*px, y+r*px+px, px, px);
      }
      ctx.fillStyle=color;
      ctx.fillRect(cx+c*px, y+r*px, px, px);
    }
    cx += 6*px;
  }
  return cx-x;
};
NQ.textWidth = function(text,px){ return String(text).length*6*px - px; };

/* ============================================================
   EFFEMERIDI SOLARI (NOAA semplificato)
   Precisione ~±5 minuti: sufficiente per pianificare un trekking.
   Norvegia ad agosto = CEST, UTC+2.
   ============================================================ */

NQ.sun = function(dateStr, lat, lon, tzHours){
  tzHours = (tzHours==null)? 2 : tzHours;
  var d = new Date(dateStr+'T12:00:00Z');
  var start = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  var N = Math.floor((d-start)/86400000)+1;

  var g = 2*Math.PI/365*(N-1);
  var cg=Math.cos(g), sg=Math.sin(g),
      c2=Math.cos(2*g), s2=Math.sin(2*g),
      c3=Math.cos(3*g), s3=Math.sin(3*g);

  var eq = 229.18*(0.000075 + 0.001868*cg - 0.032077*sg - 0.014615*c2 - 0.040849*s2);
  var decl = 0.006918 - 0.399912*cg + 0.070257*sg - 0.006758*c2 + 0.000907*s2
             - 0.002697*c3 + 0.00148*s3;

  var latR = lat*Math.PI/180;
  var z = 90.833*Math.PI/180;
  var cosH = Math.cos(z)/(Math.cos(latR)*Math.cos(decl)) - Math.tan(latR)*Math.tan(decl);

  if(cosH >  1) return { polar:'notte', rise:null, set:null, light:0 };  // sole sempre sotto
  if(cosH < -1) return { polar:'giorno', rise:null, set:null, light:1440 }; // sole di mezzanotte

  var ha = Math.acos(cosH)*180/Math.PI;
  var riseUTC = 720 - 4*(lon + ha) - eq;
  var setUTC  = 720 - 4*(lon - ha) - eq;
  var off = tzHours*60;

  /* arrotondare i minuti prima di dividere: altrimenti 04:59.7 diventa "04:60" */
  function fmt(m){
    m = Math.round(m) % 1440;
    if(m<0) m += 1440;
    return pad2(Math.floor(m/60))+':'+pad2(m%60);
  }
  return {
    polar:null,
    rise: fmt(riseUTC+off),
    set:  fmt(setUTC+off),
    light: Math.round(setUTC-riseUTC)
  };
};

var KEY='norgequest.v1';

var Store = {
  d:null,

  /* Lo stato è diviso in due: quello che si sincronizza fra i due
     dispositivi e quello che resta locale. Le foto restano locali perché
     sono troppo pesanti; XP e trofei perché si ricavano dal resto. */
  blank:function(){
    return { v:6,
      /* --- sincronizzato --- */
      done:{}, doneTs:{}, journal:{}, exp:[], deleted:{},
      people:[{id:'p1',name:'Io',ts:0},{id:'p2',name:'Compagno',ts:0}],
      rate:NQ.TRIP.rate, budget:null, display:'eur', metaTs:0,
      /* --- solo su questo dispositivo --- */
      photos:[], trophies:{}, mute:true, seen:false,
      sync:{ url:'', code:'', last:0, auto:true }
    };
  },

  load:function(){
    try{
      var raw=localStorage.getItem(KEY);
      this.d = raw? JSON.parse(raw) : this.blank();
    }catch(e){ this.d=this.blank(); }

    /* migrazione difensiva: se manca un campo, lo si ricrea */
    var b=this.blank();
    for(var k in b) if(!(k in this.d)) this.d[k]=b[k];
    if(!this.d.people || !this.d.people.length) this.d.people=b.people;

    /* v1 → v2: le spese non sapevano chi avesse pagato.
       Vengono attribuite alla prima persona e divise fra tutti. */
    var ids=this.d.people.map(function(p){ return p.id; });
    this.d.exp.forEach(function(e){
      if(!e.payer) e.payer=ids[0];
      if(!e.split || !e.split.length) e.split=ids.slice();
      if(e.day==null) e.day=1;
    });

    /* v2 → v3: categorie rinominate e spacchettate. Una spesa con una
       categoria non più esistente finirebbe fuori da ogni grafico. */
    this.d.exp.forEach(function(e){
      if(NQ.CATS_RINOMINATE[e.cat]) e.cat=NQ.CATS_RINOMINATE[e.cat];
      if(!NQ.CATS[e.cat]) e.cat='altro';
    });

    /* v3 → v4: l'itinerario è cambiato e Besseggen non c'è più.
       Un trofeo orfano continuerebbe a essere contato nel totale. */
    var noti={};
    NQ.TROPHIES.forEach(function(t){ noti[t.id]=1; });
    Object.keys(this.d.trophies).forEach(function(id){
      if(!noti[id]) delete this.d.trophies[id];
    }, this);

    /* v4 → v5: ogni record prende una marca temporale, altrimenti unire
       due dispositivi sarebbe indovinare chi ha ragione. Gli XP salvati
       spariscono: ora si ricavano dai giorni completati. */
    delete this.d.xp;
    var t0=Date.now();
    Object.keys(this.d.done).forEach(function(k){
      if(this.d.doneTs[k]==null) this.d.doneTs[k]=t0;
    }, this);
    this.d.exp.forEach(function(e){ if(!e.ts) e.ts=t0; });
    Object.keys(this.d.journal).forEach(function(k){
      if(!this.d.journal[k].ts) this.d.journal[k].ts=t0;
    }, this);
    this.d.people.forEach(function(p){ if(p.ts==null) p.ts=0; });
    if(!this.d.metaTs) this.d.metaTs=0;

    /* v5 → v6: gli importi smettono di essere sempre in corone.
       Quelli già registrati erano in NOK, quindi si etichettano così:
       nessun valore cambia, cambia solo il fatto che ora è dichiarato. */
    this.d.exp.forEach(NQ.normalizzaSpesa);
    if(!NQ.CUR[this.d.display]) this.d.display='eur';

    this.d.v=6;
    return this.d;
  },

  save:function(){
    try{ localStorage.setItem(KEY, JSON.stringify(this.d)); }
    catch(e){ NQ.toast('Memoria piena','Il salvataggio non è riuscito. Esporta il diario per liberare spazio.'); }
  },

  reset:function(){
    this.d=this.blank(); this.save();
    return Photos.clear();
  }
};
NQ.store=Store;

var Photos = {
  db:null,

  open:function(){
    var self=this;
    if(self.db) return Promise.resolve(self.db);
    return new Promise(function(res,rej){
      if(!window.indexedDB) return rej(new Error('IndexedDB non disponibile'));
      var rq=indexedDB.open('norgequest',1);
      rq.onupgradeneeded=function(e){
        var db=e.target.result;
        if(!db.objectStoreNames.contains('photos'))
          db.createObjectStore('photos',{keyPath:'id'});
      };
      rq.onsuccess=function(e){ self.db=e.target.result; res(self.db); };
      rq.onerror=function(){ rej(rq.error); };
    });
  },

  tx:function(mode){
    return this.open().then(function(db){
      return db.transaction('photos',mode).objectStore('photos');
    });
  },

  put:function(rec){
    return this.tx('readwrite').then(function(st){
      return new Promise(function(res,rej){
        var r=st.put(rec); r.onsuccess=function(){res(rec);}; r.onerror=function(){rej(r.error);};
      });
    });
  },

  get:function(id){
    return this.tx('readonly').then(function(st){
      return new Promise(function(res,rej){
        var r=st.get(id); r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);};
      });
    });
  },

  all:function(){
    return this.tx('readonly').then(function(st){
      return new Promise(function(res,rej){
        var out=[], r=st.openCursor();
        r.onsuccess=function(e){
          var c=e.target.result;
          if(c){ out.push(c.value); c.continue(); } else res(out);
        };
        r.onerror=function(){ rej(r.error); };
      });
    });
  },

  del:function(id){
    return this.tx('readwrite').then(function(st){
      return new Promise(function(res,rej){
        var r=st.delete(id); r.onsuccess=function(){res();}; r.onerror=function(){rej(r.error);};
      });
    });
  },

  clear:function(){
    return this.tx('readwrite').then(function(st){
      return new Promise(function(res,rej){
        var r=st.clear(); r.onsuccess=function(){res();}; r.onerror=function(){rej(r.error);};
      });
    });
  }
};

/* Le foto vengono conservate come sono, a piena risoluzione: è l'originale
   che finisce nell'album scaricabile. Quello che si genera qui è solo la
   miniatura per la griglia del diario — caricare venti foto da 5 MB per
   mostrarle a 90 pixel bloccherebbe il telefono. */
NQ.makeThumb = function(file, max){
  max = max||320;
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file);
    var img=new Image();
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('immagine non valida')); };
    img.onload=function(){
      var w=img.width, h=img.height, s=Math.min(1, max/Math.max(w,h));
      var cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(w*s)); cv.height=Math.max(1,Math.round(h*s));
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      res({ thumb:cv.toDataURL('image/jpeg',0.7), w:w, h:h });
    };
    img.src=url;
  });
};

/* Quanto spazio stanno occupando le foto, e quanto ne resta. */
NQ.storageInfo = function(){
  if(!navigator.storage || !navigator.storage.estimate) return Promise.resolve(null);
  return navigator.storage.estimate().then(function(e){
    return { used:e.usage||0, quota:e.quota||0 };
  }).catch(function(){ return null; });
};

/* Senza questo il browser può buttare via IndexedDB quando lo spazio scarseggia.
   Su quindici giorni di viaggio è una perdita che non si recupera. */
NQ.persistStorage = function(){
  if(!navigator.storage || !navigator.storage.persist) return Promise.resolve(false);
  return navigator.storage.persisted().then(function(already){
    return already? true : navigator.storage.persist();
  }).catch(function(){ return false; });
};

/* ============================================================
   AUDIO — chiptune originale, sintetizzato in Web Audio
   2 canali pulse (duty variabile come sul DMG), 1 triangolo, 1 rumore.
   Nessun file audio: le tracce sono array di note.
   ============================================================ */

var NOTE={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function freq(n){
  if(!n) return 0;
  var m=/^([A-G]#?)(-?\d)$/.exec(n); if(!m) return 0;
  var semi = NOTE[m[1]] + (+m[2]+1)*12;      // C4 = 60
  return 440*Math.pow(2,(semi-69)/12);
}
/* espande [[nota,durata], ...] in un array di step */
function expand(seq){
  var out=[];
  for(var i=0;i<seq.length;i++){
    var n=seq[i][0], d=seq[i][1];
    out.push(n);
    for(var k=1;k<d;k++) out.push('-');   // '-' = tieni la nota
  }
  return out;
}
/* pattern di basso: per ogni accordo 8 step → root, ottava, quinta, ottava */
function bassLine(chords){
  var out=[];
  chords.forEach(function(ch){
    var r=ch[0], o=ch[1], f=ch[2];
    out.push(r,'-',o,'-',f,'-',o,'-');
  });
  return out;
}

var Chip = {
  ctx:null, master:null, waves:{}, noiseBuf:null,
  track:null, step:0, next:0, timer:null, muted:true,

  init:function(){
    if(this.ctx) return true;
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.16;
    this.master.connect(this.ctx.destination);

    /* rumore bianco per la percussione */
    var len = this.ctx.sampleRate*0.5;
    this.noiseBuf = this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    var ch=this.noiseBuf.getChannelData(0);
    for(var i=0;i<len;i++) ch[i]=Math.random()*2-1;
    return true;
  },

  /* onda quadra a duty cycle arbitrario, via serie di Fourier */
  wave:function(duty){
    var k='d'+duty;
    if(this.waves[k]) return this.waves[k];
    var n=24, re=new Float32Array(n), im=new Float32Array(n);
    for(var h=1;h<n;h++){
      re[h]=0;
      im[h]=(2/(h*Math.PI))*Math.sin(h*Math.PI*duty);
    }
    this.waves[k]=this.ctx.createPeriodicWave(re,im,{disableNormalization:false});
    return this.waves[k];
  },

  tone:function(f,t,dur,duty,gain){
    if(!f) return;
    var o=this.ctx.createOscillator(), g=this.ctx.createGain();
    if(duty===null) o.type='triangle';
    else o.setPeriodicWave(this.wave(duty));
    o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(gain,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.02);
  },

  hit:function(t,low){
    var s=this.ctx.createBufferSource(), g=this.ctx.createGain(), f=this.ctx.createBiquadFilter();
    s.buffer=this.noiseBuf;
    f.type = low? 'lowpass':'highpass';
    f.frequency.value = low? 220 : 5200;
    g.gain.setValueAtTime(low?0.5:0.14, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+(low?0.13:0.035));
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t+0.2);
  },

  /* durata di una nota tenuta: conta quanti '-' seguono */
  held:function(arr,i,spb){
    var d=1;
    while(arr[i+d]==='-') d++;
    return d*spb*0.94;
  },

  schedule:function(){
    var T=this.track; if(!T) return;
    var spb = 60/T.bpm/4;                       // sedicesimi
    var len = Math.max(T.sq1.length, T.tri.length);

    while(this.next < this.ctx.currentTime + 0.18){
      var i=this.step, t=this.next;

      var a=T.sq1[i]; if(a && a!=='-') this.tone(freq(a),t,this.held(T.sq1,i,spb),T.duty[0],0.30);
      var b=T.sq2[i]; if(b && b!=='-') this.tone(freq(b),t,this.held(T.sq2,i,spb),T.duty[1],0.16);
      var c=T.tri[i]; if(c && c!=='-') this.tone(freq(c),t,this.held(T.tri,i,spb),null,0.42);
      if(i%8===0)      this.hit(t,true);
      else if(i%4===2) this.hit(t,false);

      this.next += spb;
      this.step++;
      if(this.step>=len){
        if(T.loop) this.step=0;
        else { this.stop(); return; }
      }
    }
  },

  play:function(name){
    if(this.muted) return;
    if(!this.init()) return;
    if(this.ctx.state==='suspended') this.ctx.resume();
    if(this.track===TRACKS[name] && this.timer) return;   // già in esecuzione
    this.stop();
    this.track=TRACKS[name];
    if(!this.track) return;
    this.step=0;
    this.next=this.ctx.currentTime+0.06;
    var self=this;
    this.timer=setInterval(function(){ self.schedule(); },25);
    this.schedule();
  },

  /* jingle one-shot che non interrompe definitivamente la traccia di fondo */
  sting:function(){
    if(this.muted || !this.init()) return;
    var back = this.trackName;
    this.play('fanfare');
    var self=this;
    setTimeout(function(){ if(back && back!=='fanfare') self.play(back); }, 2600);
  },

  stop:function(){
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
    this.track=null;
  },

  setMute:function(m){
    this.muted=m;
    if(m){ this.stop(); }
    else if(this.trackName){ this.play(this.trackName); }
  },

  /* traccia "desiderata" dalla vista corrente, ripresa quando si toglie il mute */
  want:function(name){
    this.trackName=name;
    if(!this.muted) this.play(name);
  }
};
NQ.chip=Chip;
/* usato dai test: i tre canali di una traccia devono avere la stessa
   lunghezza, altrimenti il loop va fuori fase dopo il primo giro */
NQ.chipDebug={ TRACKS:TRACKS, freq:freq };

/* ============================================================
   DENARO
   Ogni spesa conserva l'importo NELLA VALUTA IN CUI È STATA INSERITA.
   Convertire subito in una valuta unica e riconvertire per mostrarla
   falsa il dato: un volo pagato 180,00 € non tornerebbe mai
   esattamente 180,00, e cambiando il tasso cambierebbe pure il
   passato. La conversione avviene solo al momento di sommare
   valute diverse, e solo lì.
   ============================================================ */

NQ.CUR = {
  eur:{ sym:'€',  nome:'euro',   dec:2 },
  nok:{ sym:'kr', nome:'corone', dec:0 }
};

NQ.display = function(){
  var v=NQ.store.d.display;
  return NQ.CUR[v] ? v : 'eur';
};

NQ.rate = function(){ return NQ.store.d.rate || NQ.TRIP.rate; };

/* Valore di una spesa nella valuta richiesta. Se coincide con quella
   di inserimento non si tocca niente: resta l'importo esatto. */
NQ.val = function(e, cur){
  cur = cur || NQ.display();
  var a = e.amt != null ? e.amt : e.nok;      // record non ancora migrati
  var c = e.cur || 'nok';
  if(c === cur) return a;
  return c === 'nok' ? a / NQ.rate() : a * NQ.rate();
};

/* I costi stimati dell'itinerario sono in corone: questa li porta
   nella valuta di visualizzazione. */
NQ.daNok = function(n, cur){
  cur = cur || NQ.display();
  return cur === 'nok' ? n : n / NQ.rate();
};

NQ.fmt = function(v, cur){
  cur = cur || NQ.display();
  var C = NQ.CUR[cur];
  return v.toLocaleString('it-IT', {
    minimumFractionDigits:C.dec, maximumFractionDigits:C.dec
  }) + ' ' + C.sym;
};

/* Riporta una spesa alla forma corrente. Serve sia alla migrazione sia
   ai dati che arrivano da un dispositivo con una versione precedente. */
NQ.normalizzaSpesa = function(e){
  if(e && e.amt == null && e.nok != null){
    e.amt = e.nok; e.cur = 'nok'; delete e.nok;
  }
  if(e && !e.cur) e.cur = 'nok';
  return e;
};

/* ============================================================
   CONTI CONDIVISI
   Chi ha anticipato quanto, quanto gli spetta, e il minor numero
   di passaggi di denaro che pareggia tutto.

   Tutta l'aritmetica avviene in unità minime intere — centesimi per
   l'euro, corone per la NOK — perché sommando decimali i conti non
   chiudono e restano differenze di un centesimo che non si spiegano.
   ============================================================ */

function minori(e, cur){ return Math.round(NQ.val(e, cur) * 100); }

/* Le divisioni in parti uguali lasciano un resto. Viene distribuito
   sui primi partecipanti invece di sparire: così la somma delle quote
   è sempre esattamente il totale speso. */
function shares(e, cur){
  var out={}, n=e.split.length;
  if(!n) return out;
  var tot=minori(e, cur);
  var base=Math.floor(tot/n), resto=tot-base*n;
  e.split.forEach(function(id,i){ out[id]=base+(i<resto?1:0); });
  return out;
}

/* Importi restituiti nella valuta di visualizzazione, già divisi per 100. */
NQ.balances=function(cur){
  cur = cur || NQ.display();
  var s=NQ.store.d, paid={}, owed={};
  s.people.forEach(function(p){ paid[p.id]=0; owed[p.id]=0; });

  s.exp.forEach(function(e){
    if(paid[e.payer]!=null) paid[e.payer]+=minori(e, cur);
    var sh=shares(e, cur);
    for(var id in sh) if(owed[id]!=null) owed[id]+=sh[id];
  });

  return s.people.map(function(p){
    return { id:p.id, name:p.name,
             paid:paid[p.id]/100, owed:owed[p.id]/100,
             net:(paid[p.id]-owed[p.id])/100 };
  });
};

/* Somma di un elenco di spese nella valuta di visualizzazione. */
NQ.totale=function(list, cur){
  cur = cur || NQ.display();
  var m=0;
  list.forEach(function(e){ m += minori(e, cur); });
  return m/100;
};

/* Abbinamento avido fra chi è in credito e chi è in debito:
   con N persone servono al più N-1 passaggi di denaro. */
NQ.settle=function(cur){
  cur = cur || NQ.display();
  var bal=NQ.balances(cur);
  var cred=bal.filter(function(b){return b.net>0;})
              .map(function(b){return {name:b.name, v:Math.round(b.net*100)};})
              .sort(function(a,b){return b.v-a.v;});
  var debt=bal.filter(function(b){return b.net<0;})
              .map(function(b){return {name:b.name, v:Math.round(-b.net*100)};})
              .sort(function(a,b){return b.v-a.v;});

  var out=[], i=0, j=0, guard=0;
  while(i<debt.length && j<cred.length && guard++<200){
    var amt=Math.min(debt[i].v, cred[j].v);
    if(amt>0) out.push({ from:debt[i].name, to:cred[j].name, amt:amt/100 });
    debt[i].v-=amt; cred[j].v-=amt;
    if(debt[i].v<=0) i++;
    if(cred[j].v<=0) j++;
  }
  return out;
};

/* ============================================================
   TOAST + CONFETTI
   ============================================================ */

NQ.toast = function(title, msg, big){
  var host=$('#toast'); if(!host) return;
  var el=document.createElement('div');
  el.className='toastmsg'+(big?' big':'');
  el.innerHTML = (title? '<span class="tt">'+esc(title)+'</span>':'') + esc(msg);
  host.appendChild(el);
  setTimeout(function(){
    el.style.transition='opacity .3s'; el.style.opacity='0';
    setTimeout(function(){ el.remove(); },320);
  }, big? 4200:2600);
};

NQ.confetti = function(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  var cv=$('#confetti'); if(!cv) return;
  var cx=cv.getContext('2d');
  cv.width=innerWidth; cv.height=innerHeight; cv.style.display='block';
  var cols=['#f5c542','#7fdb6a','#4a9de8','#e8544b','#a367d6','#ffffff'];
  var bits=[];
  for(var i=0;i<90;i++) bits.push({
    x:Math.random()*cv.width, y:-Math.random()*cv.height*0.5,
    vx:(Math.random()-0.5)*2.4, vy:2+Math.random()*3.2,
    s:3+Math.floor(Math.random()*3)*3,
    c:cols[Math.floor(Math.random()*cols.length)]
  });
  var t0=performance.now();
  (function frame(now){
    cx.clearRect(0,0,cv.width,cv.height);
    bits.forEach(function(b){
      b.x+=b.vx; b.y+=b.vy; b.vy+=0.045;
      cx.fillStyle=b.c;
      cx.fillRect(Math.round(b.x), Math.round(b.y), b.s, b.s);
    });
    if(now-t0 < 2600) requestAnimationFrame(frame);
    else { cx.clearRect(0,0,cv.width,cv.height); cv.style.display='none'; }
  })(t0);
};

/* ============================================================
   XP E TROFEI
   ============================================================ */

/* Tarati sugli XP totali dell'itinerario: chi completa tutto arriva
   a livello 11 esatto l'ultimo giorno. Da ricalibrare se cambiano i giorni. */
NQ.LEVELS = [0,210,470,780,1150,1570,2040,2560,3150,3800,4550];

/* Gli XP non si salvano: si ricavano dai giorni completati.
   Un contatore memorizzato andrebbe fuso fra due dispositivi che
   segnano giorni diversi, e sommare due totali darebbe il doppio. */
NQ.xp = function(){
  var d=NQ.store.d, tot=0;
  NQ.DAYS.forEach(function(day){ if(d.done[day.n]) tot+=day.xp; });
  return tot;
};

NQ.level = function(xp){
  var L=NQ.LEVELS, i=0;
  while(i<L.length-1 && xp>=L[i+1]) i++;
  var cur=L[i], nxt=L[i+1]!=null? L[i+1] : cur+1;
  return { lv:i+1, cur:cur, next:L[i+1]!=null? nxt:null,
           pct: L[i+1]!=null? Math.min(100,Math.round((xp-cur)/(nxt-cur)*100)) : 100 };
};

/* Da chiamare intorno a una modifica dei giorni completati:
   confronta il livello prima e dopo e festeggia se è salito. */
NQ.withLevelUp = function(fn){
  var before=NQ.level(NQ.xp()).lv;
  fn();
  var after=NQ.level(NQ.xp()).lv;
  if(after>before){
    NQ.toast('Livello '+after, 'Sei salito di livello.', true);
    NQ.chip.sting();
  }
};

NQ.award = function(id){
  var d=NQ.store.d;
  if(d.trophies[id]) return false;
  var t=NQ.TROPHIES.filter(function(x){return x.id===id;})[0];
  if(!t) return false;
  d.trophies[id]=Date.now();
  NQ.store.save();
  NQ.toast('Trofeo sbloccato', t.icon+'  '+t.name, true);
  NQ.confetti();
  NQ.chip.sting();
  return true;
};

/* Rivaluta tutti i trofei condizionali. Idempotente. */
NQ.checkTrophies = function(){
  var d=NQ.store.d;

  NQ.DAYS.forEach(function(day){
    if(day.trek && d.done[day.n]) NQ.award(day.trek);
  });
  if(d.done[12]) NQ.award('surf');

  var walkDays=NQ.DAYS.filter(function(day){ return day.walk; });
  if(walkDays.length && walkDays.every(function(day){ return d.done[day.n]; }))
    NQ.award('camminate');

  var jn=Object.keys(d.journal).filter(function(k){
    return (d.journal[k].txt||'').trim().length>0;
  });
  if(jn.length>=15) NQ.award('cronista');
  if(d.exp.length>=10) NQ.award('contabile');
  if(d.photos.length>=10) NQ.award('fotografo');
  if(Object.keys(d.done).filter(function(k){return d.done[k];}).length>=15) NQ.award('leggenda');

  var late = jn.some(function(k){
    var ts=d.journal[k].ts; if(!ts) return false;
    var h=new Date(ts).getHours();
    return h>=23 || h<3;
  });
  if(late) NQ.award('nottambulo');
};

})();


/* ==== zip.js ================================================== */
/* ============================================================
   NORGE QUEST — ZIP
   Scrittura e lettura di archivi senza compressione (metodo "store").
   Le foto sono già JPEG: comprimerle una seconda volta non guadagna
   nulla, e senza deflate l'implementazione sta in poche decine di righe
   e non serve alcuna libreria esterna.
   ============================================================ */

(function(){
'use strict';

/* ---------- CRC32 ---------- */

var CRC = (function(){
  var t=new Uint32Array(256);
  for(var n=0;n<256;n++){
    var c=n;
    for(var k=0;k<8;k++) c = (c&1)? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
    t[n]=c>>>0;
  }
  return t;
})();

function crc32(u8){
  var c=0xFFFFFFFF;
  for(var i=0;i<u8.length;i++) c = CRC[(c ^ u8[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF)>>>0;
}

/* ---------- scrittura binaria ---------- */

function W(n){ var b=new Uint8Array(n); b._o=0; return b; }
function u16(b,v){ b[b._o++]=v&255; b[b._o++]=(v>>>8)&255; }
function u32(b,v){ b[b._o++]=v&255; b[b._o++]=(v>>>8)&255; b[b._o++]=(v>>>16)&255; b[b._o++]=(v>>>24)&255; }
function str(b,s){ for(var i=0;i<s.length;i++) b[b._o++]=s.charCodeAt(i); }

function utf8(s){
  if(window.TextEncoder) return new TextEncoder().encode(s);
  var out=[], i, c;
  for(i=0;i<s.length;i++){
    c=s.charCodeAt(i);
    if(c<128) out.push(c);
    else if(c<2048){ out.push(192|(c>>6), 128|(c&63)); }
    else { out.push(224|(c>>12), 128|((c>>6)&63), 128|(c&63)); }
  }
  return new Uint8Array(out);
}

function bytesOf(data){
  if(data instanceof Uint8Array) return Promise.resolve(data);
  if(typeof data === 'string')   return Promise.resolve(utf8(data));
  if(data instanceof ArrayBuffer) return Promise.resolve(new Uint8Array(data));
  // Blob
  if(data.arrayBuffer) return data.arrayBuffer().then(function(b){ return new Uint8Array(b); });
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){ res(new Uint8Array(fr.result)); };
    fr.onerror=function(){ rej(new Error('lettura blob fallita')); };
    fr.readAsArrayBuffer(data);
  });
}

function dosTime(dt){
  return ((dt.getHours()<<11) | (dt.getMinutes()<<5) | (dt.getSeconds()>>1)) & 0xFFFF;
}
function dosDate(dt){
  return (((dt.getFullYear()-1980)<<9) | ((dt.getMonth()+1)<<5) | dt.getDate()) & 0xFFFF;
}

/* files: [{ name, data }] — data può essere stringa, Blob, Uint8Array.
   Ritorna una Promise<Blob>. I byte delle foto non restano tutti in
   memoria: si leggono uno alla volta per il CRC e poi si passa il Blob
   originale al costruttore finale. */
NQ.zipCreate = function(files){
  var parts=[], central=[], offset=0;
  var now=new Date(), time=dosTime(now), date=dosDate(now);

  return files.reduce(function(chain, f){
    return chain.then(function(){
      return bytesOf(f.data).then(function(u8){
        var name=utf8(f.name), crc=crc32(u8), size=u8.length;

        var lh=W(30+name.length);
        u32(lh,0x04034b50); u16(lh,20); u16(lh,0x0800); u16(lh,0);   // 0x0800 = nome in UTF-8
        u16(lh,time); u16(lh,date);
        u32(lh,crc); u32(lh,size); u32(lh,size);
        u16(lh,name.length); u16(lh,0);
        lh.set(name,30);

        parts.push(lh, u8);
        central.push({ name:name, crc:crc, size:size, offset:offset });
        offset += lh.length + size;
      });
    });
  }, Promise.resolve()).then(function(){

    var cdParts=[], cdSize=0;
    central.forEach(function(c){
      var ch=W(46+c.name.length);
      u32(ch,0x02014b50); u16(ch,20); u16(ch,20); u16(ch,0x0800); u16(ch,0);
      u16(ch,time); u16(ch,date);
      u32(ch,c.crc); u32(ch,c.size); u32(ch,c.size);
      u16(ch,c.name.length); u16(ch,0); u16(ch,0);
      u16(ch,0); u16(ch,0); u32(ch,0);
      u32(ch,c.offset);
      ch.set(c.name,46);
      cdParts.push(ch); cdSize += ch.length;
    });

    var end=W(22);
    u32(end,0x06054b50); u16(end,0); u16(end,0);
    u16(end,central.length); u16(end,central.length);
    u32(end,cdSize); u32(end,offset); u16(end,0);

    return new Blob(parts.concat(cdParts,[end]), { type:'application/zip' });
  });
};

/* Lettura: si scorre la directory centrale, non gli header locali,
   perché è l'unico punto in cui le dimensioni sono sempre affidabili. */
NQ.zipRead = function(blob){
  return bytesOf(blob).then(function(b){
    var dv=new DataView(b.buffer, b.byteOffset, b.byteLength);

    var end=-1;
    for(var i=b.length-22;i>=0 && i>b.length-65558;i--){
      if(dv.getUint32(i,true)===0x06054b50){ end=i; break; }
    }
    if(end<0) throw new Error('non è un file ZIP');

    var count=dv.getUint16(end+10,true), off=dv.getUint32(end+16,true);
    var out=[], dec = window.TextDecoder? new TextDecoder('utf-8') : null;

    for(var k=0;k<count;k++){
      if(dv.getUint32(off,true)!==0x02014b50) throw new Error('directory centrale corrotta');
      var method=dv.getUint16(off+10,true);
      var size  =dv.getUint32(off+24,true);
      var nLen  =dv.getUint16(off+28,true);
      var eLen  =dv.getUint16(off+30,true);
      var cLen  =dv.getUint16(off+32,true);
      var lOff  =dv.getUint32(off+42,true);
      var nameBytes=b.subarray(off+46, off+46+nLen);
      var name = dec? dec.decode(nameBytes) : String.fromCharCode.apply(null, nameBytes);

      if(method!==0) throw new Error('archivio compresso: supportato solo "store"');

      var lnLen=dv.getUint16(lOff+26,true), leLen=dv.getUint16(lOff+28,true);
      var start=lOff+30+lnLen+leLen;
      out.push({ name:name, data:b.subarray(start, start+size) });

      off += 46+nLen+eLen+cLen;
    }
    return out;
  });
};

})();


/* ==== sync.js ================================================= */
/* ============================================================
   NORGE QUEST — SINCRONIZZAZIONE
   Local-first: la pagina funziona identica senza rete, e quando
   c'è campo i due dispositivi si allineano. Non esiste un momento
   in cui l'app aspetta il server per farti registrare una spesa.

   La fusione è per singolo record, non per blocco: vince la marca
   temporale più recente. Sostituire l'intero stato con quello remoto
   cancellerebbe quello che l'altro ha scritto nel frattempo.

   Nessun indirizzo e nessuna chiave stanno in questo file: URL del
   database e codice viaggio li inserisce l'utente e restano sul suo
   dispositivo. La pagina pubblica non contiene niente di personale.
   ============================================================ */

(function(){
'use strict';

/* Campi che viaggiano. Foto, trofei, audio e configurazione restano
   locali: le prime perché pesano, gli altri perché si ricavano. */
var CAMPI = ['done','doneTs','journal','exp','deleted','people','rate','budget','metaTs'];

function ora(){ return Date.now(); }

/* ---------- fusione ---------- */

/* Unisce due stati. Simmetrica e idempotente: merge(a,b) e merge(b,a)
   danno lo stesso risultato, e rifonderlo non cambia più niente. */
function fondi(a, b){
  a = a || {}; b = b || {};
  var out = {
    done:{}, doneTs:{}, journal:{}, exp:[], deleted:{},
    people:[], rate:null, budget:null, metaTs:0
  };

  /* --- lapidi: una cancellazione non deve essere resuscitata --- */
  [a.deleted, b.deleted].forEach(function(src){
    if(!src) return;
    Object.keys(src).forEach(function(id){
      out.deleted[id] = Math.max(out.deleted[id]||0, src[id]||0);
    });
  });

  /* --- spese: unione per id, vince la marca più recente --- */
  var perId = {};
  [].concat(a.exp||[], b.exp||[]).forEach(function(e){
    if(!e || !e.id) return;
    var prec = perId[e.id];
    if(!prec || (e.ts||0) > (prec.ts||0)) perId[e.id] = e;
  });
  Object.keys(perId).forEach(function(id){
    var e = perId[id];
    /* la lapide vince solo se è successiva alla modifica */
    if(out.deleted[id] && out.deleted[id] >= (e.ts||0)) return;
    out.exp.push(e);
  });
  out.exp.sort(function(x,y){ return (x.ts||0)-(y.ts||0); });

  /* --- diario: per giorno, vince la marca più recente --- */
  [a.journal, b.journal].forEach(function(src){
    if(!src) return;
    Object.keys(src).forEach(function(g){
      var v = src[g];
      if(!v) return;
      var prec = out.journal[g];
      if(!prec || (v.ts||0) > (prec.ts||0)) out.journal[g] = v;
    });
  });

  /* --- giorni completati: doneTs decide, così anche "non fatto" viaggia --- */
  var giorni = {};
  [a, b].forEach(function(src){
    Object.keys((src && src.doneTs) || {}).forEach(function(g){ giorni[g]=1; });
    Object.keys((src && src.done) || {}).forEach(function(g){ giorni[g]=1; });
  });
  Object.keys(giorni).forEach(function(g){
    var ta = (a.doneTs&&a.doneTs[g]) || 0, tb = (b.doneTs&&b.doneTs[g]) || 0;
    var vinc = ta >= tb ? a : b;
    out.doneTs[g] = Math.max(ta, tb);
    out.done[g] = !!(vinc.done && vinc.done[g]);
  });

  /* --- persone: unione per id, il nome più recente vince --- */
  var perP = {};
  [].concat(a.people||[], b.people||[]).forEach(function(p){
    if(!p || !p.id) return;
    var prec = perP[p.id];
    if(!prec || (p.ts||0) > (prec.ts||0)) perP[p.id] = p;
  });
  out.people = Object.keys(perP).map(function(k){ return perP[k]; });
  if(!out.people.length) out.people = (a.people||b.people||[]).slice();

  /* --- cambio e budget: seguono metaTs --- */
  var recente = (a.metaTs||0) >= (b.metaTs||0) ? a : b;
  var altro   = recente === a ? b : a;
  out.metaTs = Math.max(a.metaTs||0, b.metaTs||0);
  out.rate   = recente.rate   != null ? recente.rate   : altro.rate;
  out.budget = recente.budget !== undefined ? recente.budget : altro.budget;
  if(out.rate == null) out.rate = NQ.TRIP.rate;

  return out;
}

/* ---------- trasporto ---------- */
/* API REST del Realtime Database di Firebase: nessun SDK da caricare,
   quindi la pagina resta un file solo e senza dipendenze. */

function endpoint(cfg){
  var base = String(cfg.url||'').trim().replace(/\/+$/,'');
  return base + '/viaggi/' + encodeURIComponent(cfg.code) + '.json';
}

function leggi(cfg){
  return fetch(endpoint(cfg), { method:'GET', cache:'no-store' })
    .then(function(r){
      if(r.status===401 || r.status===403) throw errore('permessi', 'Il database rifiuta la lettura: controlla le regole di sicurezza.');
      if(!r.ok) throw errore('http', 'Il server ha risposto ' + r.status + '.');
      return r.json();
    });
}

function scrivi(cfg, dati){
  return fetch(endpoint(cfg), {
    method:'PUT',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify(dati)
  }).then(function(r){
    if(r.status===401 || r.status===403) throw errore('permessi', 'Il database rifiuta la scrittura: controlla le regole di sicurezza.');
    if(!r.ok) throw errore('http', 'Il server ha risposto ' + r.status + '.');
    return true;
  });
}

function errore(codice, msg){
  var e = new Error(msg); e.codice = codice; return e;
}

/* ---------- API pubblica ---------- */

var inCorso = null, attesa = null;

var Sync = {

  configurato:function(){
    var c = NQ.store.d.sync || {};
    return !!(c.url && c.code);
  },

  stato:'inattivo',   // inattivo | pronto | invio | fatto | errore | offline
  messaggio:'',

  /* Genera un codice viaggio: è di fatto una password, quindi lungo
     e casuale. Chi lo conosce accede ai dati. */
  nuovoCodice:function(){
    var alfabeto='abcdefghijkmnpqrstuvwxyz23456789';
    var out='';
    var buf = (window.crypto && crypto.getRandomValues)
      ? crypto.getRandomValues(new Uint8Array(28)) : null;
    for(var i=0;i<28;i++){
      var n = buf ? buf[i] : Math.floor(Math.random()*256);
      out += alfabeto[n % alfabeto.length];
    }
    return out;
  },

  /* Stringa d'invito: un solo testo da mandare al compagno di viaggio,
     che contiene indirizzo e codice. */
  invito:function(){
    var c = NQ.store.d.sync;
    if(!this.configurato()) return '';
    return 'NQ1:' + btoa(JSON.stringify({ u:c.url, c:c.code }))
      .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  },

  applicaInvito:function(testo){
    var t = String(testo||'').trim();
    var m = /^NQ1:([A-Za-z0-9\-_]+)$/.exec(t);
    if(!m) throw new Error('Questo non sembra un invito di Norge Quest.');
    var b64 = m[1].replace(/-/g,'+').replace(/_/g,'/');
    while(b64.length % 4) b64 += '=';
    var j;
    try { j = JSON.parse(atob(b64)); }
    catch(e){ throw new Error('L\'invito è danneggiato: fattelo rimandare.'); }
    if(!j.u || !j.c) throw new Error('L\'invito è incompleto.');
    NQ.store.d.sync.url = j.u;
    NQ.store.d.sync.code = j.c;
    NQ.store.save();
    return true;
  },

  scollega:function(){
    NQ.store.d.sync = { url:'', code:'', last:0, auto:true };
    NQ.store.save();
    this.stato='inattivo'; this.messaggio='';
  },

  /* Un giro completo: leggo il remoto, fondo, salvo, riscrivo.
     Se la rete non c'è non succede niente di male: i dati restano
     dove sono e si riproverà al prossimo giro. */
  ora:function(silenzioso){
    var self=this;
    if(!this.configurato()){
      this.stato='inattivo';
      return Promise.resolve(false);
    }
    if(inCorso) return inCorso;

    if(!navigator.onLine){
      this.stato='offline';
      this.messaggio='Nessuna rete. I dati restano qui e si allineano appena c\'è campo.';
      this.aggiornaUI();
      return Promise.resolve(false);
    }

    var cfg = NQ.store.d.sync;
    this.stato='invio'; this.messaggio='Sincronizzo…';
    this.aggiornaUI();

    inCorso = leggi(cfg).then(function(remoto){
      var locale = self.estrai();
      var unito  = fondi(locale, remoto);

      self.applica(unito);
      NQ.store.d.sync.last = ora();
      NQ.store.save();

      return scrivi(cfg, self.estrai()).then(function(){
        self.stato='fatto';
        self.messaggio='Allineato.';
        if(!silenzioso) NQ.toast('Sincronizzato', descrivi(unito));
        NQ.checkTrophies();
        NQ.renderHud();
        NQ.ridisegnaVistaCorrente();
        return true;
      });
    }).catch(function(e){
      self.stato = e.codice==='permessi' ? 'errore' : 'offline';
      self.messaggio = e.codice==='permessi'
        ? e.message
        : 'Non raggiungo il database. Riprovo più tardi: i dati sono al sicuro qui.';
      if(!silenzioso) NQ.toast('Non sincronizzato', self.messaggio);
      return false;
    }).then(function(r){
      inCorso=null;
      self.aggiornaUI();
      return r;
    });

    return inCorso;
  },

  /* Le modifiche non vanno spedite una per una: si accumulano
     qualche secondo e poi partono insieme. */
  programma:function(){
    var self=this;
    if(!this.configurato() || !NQ.store.d.sync.auto) return;
    clearTimeout(attesa);
    attesa = setTimeout(function(){ self.ora(true); }, 4000);
  },

  estrai:function(){
    var d=NQ.store.d, out={};
    CAMPI.forEach(function(k){ out[k] = d[k]; });
    out.v = 5;
    return out;
  },

  applica:function(u){
    var d=NQ.store.d;
    CAMPI.forEach(function(k){ if(u[k] !== undefined) d[k]=u[k]; });
    /* Firebase non conserva gli array vuoti né le chiavi nulle */
    if(!Array.isArray(d.exp)) d.exp = [];
    /* una spesa che arriva da un dispositivo con una versione più
       vecchia parla ancora in corone: va riportata alla forma corrente */
    d.exp.forEach(NQ.normalizzaSpesa);
    if(!d.deleted) d.deleted = {};
    if(!d.done) d.done = {};
    if(!d.doneTs) d.doneTs = {};
    if(!d.journal) d.journal = {};
    if(!Array.isArray(d.people) || !d.people.length)
      d.people = NQ.store.blank().people;
  },

  aggiornaUI:function(){
    var el=NQ.$('#syncstate');
    if(el) el.innerHTML = this.riga();
  },

  riga:function(){
    var c=NQ.store.d.sync||{};
    if(!this.configurato())
      return '<span class="sdot off"></span>Non collegato';
    var quando = c.last ? new Date(c.last).toLocaleString('it-IT',
      { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : 'mai';
    var cls = this.stato==='fatto' ? 'ok' : this.stato==='errore' ? 'bad'
            : this.stato==='invio' ? 'busy' : 'warn';
    return '<span class="sdot '+cls+'"></span>' +
           NQ.esc(this.messaggio || 'Collegato') +
           ' <s>ultimo allineamento: '+quando+'</s>';
  }
};

function descrivi(u){
  return (u.exp?u.exp.length:0)+' spese · '+
         Object.keys(u.journal||{}).length+' giorni di diario';
}

NQ.sync = Sync;
NQ.fondiStati = fondi;   // esposta per i test

})();


/* ==== map.js ================================================== */
/* ============================================================
   NORGE QUEST — MAPPA
   Coste, laghi e fiumi reali (Natural Earth 10m) rasterizzati in
   fase di build a 2 km per tile e spediti come bitmap di bit.
   Il rilievo è ricostruito qui: distanza dal mare come base,
   più i massicci veri messi al loro posto, più ombreggiatura.
   ============================================================ */

(function(){
'use strict';

var M = NQ.MAPDATA;
var COLS = M.cols, ROWS = M.rows, N = COLS*ROWS;

/* ---------- decodifica bitmap ---------- */

function unpack(b64, n){
  var bin = atob(b64), out = new Uint8Array(n);
  for(var i=0;i<n;i++) out[i] = (bin.charCodeAt(i>>3) >> (7-(i&7))) & 1;
  return out;
}
var LAND = unpack(M.land, N);
var LAKE = unpack(M.lake, N);

/* ---------- proiezione ---------- */

function toGrid(lon,lat){
  return [ (lon-M.lon0)/(M.lon1-M.lon0)*COLS,
           (M.lat1-lat)/(M.lat1-M.lat0)*ROWS ];
}
var KM_PER_TILE = (M.lon1-M.lon0)*111*Math.cos((M.lat0+M.lat1)/2*Math.PI/180)/COLS;

/* ---------- massicci ---------- */
/* La distanza dal mare da sola metterebbe le montagne al centro
   geometrico del paese. Questi le rimettono dove stanno davvero. */

var MASSIF = [
  // lon    lat     raggio km  spinta
  [ 8.35, 61.50,  55,  0.62],  // Jotunheimen — Galdhøpiggen, 2469 m
  [ 7.05, 61.68,  45,  0.66],  // Jostedalsbreen — il ghiacciaio più grande d'Europa continentale
  [ 7.80, 61.82,  35,  0.50],  // Breheimen
  [ 9.20, 62.10,  55,  0.52],  // Dovrefjell — Reinheimen
  [ 9.85, 61.85,  35,  0.50],  // Rondane
  [ 8.20, 61.10,  40,  0.44],  // Filefjell — Langfjella
  [ 8.05, 60.75,  35,  0.44],  // Skarvheimen
  [ 7.60, 60.30,  70,  0.46],  // Hardangervidda — l'altopiano
  [ 6.35, 60.05,  24,  0.58],  // Folgefonna — il ghiacciaio sopra Odda
  [ 7.85, 60.62,  30,  0.50],  // Hallingskarvet
  [ 7.20, 59.85,  35,  0.42],  // Haukelifjell
  [ 7.30, 59.30,  45,  0.34],  // Setesdalsheiene
  [ 6.75, 59.10,  32,  0.38],  // Ryfylkeheiane — il Kjerag sta qui
  [ 6.60, 60.55,  28,  0.36],  // monti sopra Voss
  // pianure: senza queste, la costa piatta si colora come collina
  [ 5.65, 58.70,  32, -0.24],  // Jæren
  [10.90, 59.70,  50, -0.24],  // Østfold e l'entroterra di Oslo
  [10.75, 60.70,  35, -0.20],  // valle del Mjøsa
  [ 9.50, 61.45,  22, -0.16],  // Gudbrandsdalen — la valle, non la cresta
  [ 8.10, 58.30,  45, -0.16]   // Sørlandet
];

/* ---------- rilievo ---------- */

var elev = null;

function buildElev(){
  if(elev) return elev;

  /* distanza dal mare aperto: i laghi non contano, in Norvegia
     stanno in quota quanto le montagne che li circondano */
  var dist = new Int16Array(N).fill(-1);
  var q = new Int32Array(N), head=0, tail=0;
  for(var i=0;i<N;i++) if(!LAND[i]){ dist[i]=0; q[tail++]=i; }

  while(head<tail){
    var c=q[head++], cx=c%COLS, cy=(c/COLS)|0, nd=dist[c]+1;
    if(cx>0      && dist[c-1]===-1)   { dist[c-1]=nd;   q[tail++]=c-1; }
    if(cx<COLS-1 && dist[c+1]===-1)   { dist[c+1]=nd;   q[tail++]=c+1; }
    if(cy>0      && dist[c-COLS]===-1){ dist[c-COLS]=nd;q[tail++]=c-COLS; }
    if(cy<ROWS-1 && dist[c+COLS]===-1){ dist[c+COLS]=nd;q[tail++]=c+COLS; }
  }

  var maxD=0;
  for(i=0;i<N;i++) if(dist[i]>maxD) maxD=dist[i];

  elev = new Float32Array(N);
  for(i=0;i<N;i++){
    if(!LAND[i]){ elev[i] = -dist[i]/maxD; continue; }   // negativo = profondità del mare
    /* Base volutamente bassa. Da sola la distanza dal mare metterebbe
       il tetto della Norvegia al confine svedese, che è il posto
       sbagliato: sono i massicci qui sotto a decidere dove si sale. */
    elev[i] = Math.pow(Math.min(1, dist[i]/(maxD*0.45)), 0.8) * 0.38;
  }

  /* i massicci, sommati in gaussiana */
  MASSIF.forEach(function(m){
    var g=toGrid(m[0],m[1]), gx=g[0], gy=g[1];
    var r=m[2]/KM_PER_TILE, s2=2*(r/2)*(r/2), lim=Math.ceil(r*1.6);
    var x0=Math.max(0,Math.floor(gx-lim)), x1=Math.min(COLS-1,Math.ceil(gx+lim));
    var y0=Math.max(0,Math.floor(gy-lim)), y1=Math.min(ROWS-1,Math.ceil(gy+lim));
    for(var y=y0;y<=y1;y++) for(var x=x0;x<=x1;x++){
      var idx=y*COLS+x; if(!LAND[idx]) continue;
      var dx=x-gx, dy=y-gy;
      elev[idx] += m[3]*Math.exp(-(dx*dx+dy*dy)/s2);
    }
  });

  /* grana fine, deterministica: rompe le fasce di colore */
  for(i=0;i<N;i++) if(LAND[i]) elev[i] = Math.max(0, Math.min(1, elev[i] + (hash(i)-0.5)*0.05));

  return elev;
}

function hash(i){
  var h = i*374761393;
  h = (h ^ (h>>13)) * 1274126177;
  return ((h ^ (h>>16)) >>> 0) / 4294967296;
}

/* ---------- palette ---------- */
/* Verdi profondi sulla costa, ocra sull'altopiano, roccia e infine
   ghiaccio: la scala di una carta topografica norvegese. */

var TERRA = [
  [0.00,0x4a,0x7a,0x4d], [0.08,0x42,0x72,0x48], [0.16,0x37,0x64,0x40],
  [0.26,0x3c,0x63,0x42], [0.36,0x4c,0x66,0x44], [0.45,0x60,0x6c,0x47],
  [0.54,0x74,0x71,0x4c], [0.63,0x82,0x78,0x59], [0.72,0x8d,0x86,0x72],
  [0.80,0x9c,0x99,0x90], [0.88,0xb5,0xb6,0xb2], [0.95,0xdb,0xe4,0xe8]
];
var MARE = [
  [0.00,0x33,0x77,0xa6], [0.06,0x27,0x62,0x8e], [0.14,0x1d,0x4e,0x74],
  [0.26,0x17,0x3e,0x5e], [0.45,0x11,0x31,0x4c]
];
var ACQUA_INT = [0x3f,0x8c,0xc4];   // laghi e fiumi

function band(scale,v){
  var b=scale[0];
  for(var i=1;i<scale.length;i++){ if(v>=scale[i][0]) b=scale[i]; else break; }
  return b;
}

/* ---------- terreno pre-renderizzato ---------- */
/* Scritto una volta sola in un'ImageData 1 pixel per cella, poi
   ingrandita con lo smoothing spento: pixel netti a ogni zoom. */

var tile=null;

function bakeTile(){
  if(tile) return tile;
  var e=buildElev();
  var cv=document.createElement('canvas');
  cv.width=COLS; cv.height=ROWS;
  var cx=cv.getContext('2d');
  var img=cx.createImageData(COLS,ROWS), px=img.data;

  for(var y=0;y<ROWS;y++) for(var x=0;x<COLS;x++){
    var i=y*COLS+x, o=i*4, c, shade=1;

    if(LAKE[i] && LAND[i]){
      c=ACQUA_INT;
    } else if(!LAND[i]){
      c=band(MARE, -e[i]).slice(1);
    } else {
      c=band(TERRA, e[i]).slice(1);
      /* ombreggiatura con luce da nord-ovest, quantizzata su tre
         livelli per non impastare l'effetto pixel */
      var nw = (x>0 && y>0)? e[i-COLS-1] : e[i];
      var d = e[i]-nw;
      shade = d >  0.012 ? 1.14 : d < -0.012 ? 0.86 : 1;
    }
    px[o  ]=Math.max(0,Math.min(255, c[0]*shade));
    px[o+1]=Math.max(0,Math.min(255, c[1]*shade));
    px[o+2]=Math.max(0,Math.min(255, c[2]*shade));
    px[o+3]=255;
  }
  cx.putImageData(img,0,0);
  tile=cv;
  return tile;
}

/* ---------- nodi ---------- */

function nodes(ts){
  return NQ.DAYS.map(function(day){
    var p=toGrid(day.lon,day.lat);
    return { n:day.n, day:day, x:Math.round(p[0]*ts), y:Math.round(p[1]*ts) };
  });
}

/* scintille sull'acqua: poche celle scelte una volta, accese a turno */
var SPARK=[];
(function(){
  for(var i=0;i<N;i++){
    if(LAND[i]) continue;
    if(hash(i*7+3) > 0.997) SPARK.push([i%COLS,(i/COLS)|0, hash(i)]);
  }
})();

/* ---------- renderer ---------- */

var Map = {
  cv:null, cx:null, ts:2, raf:null, t0:0, nodeCache:null, bound:false,

  mount:function(canvas){
    this.cv=canvas;
    this.cx=canvas.getContext('2d');
    var self=this;
    canvas.addEventListener('click',function(e){ self.click(e); });
    this.resize();
    if(!this.bound){
      this.bound=true;
      addEventListener('resize', function(){ self.resize(); self.drawStatic(); });
    }
  },

  resize:function(){
    if(!this.cv) return;
    var avail=Math.max(280, this.cv.parentElement.clientWidth-8);
    this.ts=Math.max(2, Math.min(5, Math.floor(avail/COLS)));

    var w=COLS*this.ts, h=ROWS*this.ts;
    var dpr=Math.min(3, window.devicePixelRatio||1);
    this.cv.style.width=w+'px'; this.cv.style.height=h+'px';
    this.cv.width=Math.round(w*dpr); this.cv.height=Math.round(h*dpr);
    this.cx.setTransform(dpr,0,0,dpr,0,0);
    this.cx.imageSmoothingEnabled=false;
    this.nodeCache=nodes(this.ts);
  },

  reached:function(){
    var ph=NQ.phase();
    if(ph==='pre')  return 0;
    if(ph==='post') return NQ.DAYS.length-1;
    var i=NQ.dayIndex();
    return i<0? 0 : i;
  },

  start:function(){
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
    if(reduce){ this.drawStatic(); return; }
    if(this.raf) return;
    this.t0=performance.now();
    var self=this;
    (function loop(now){ self.draw(now); self.raf=requestAnimationFrame(loop); })(performance.now());
  },

  stop:function(){ if(this.raf){ cancelAnimationFrame(this.raf); this.raf=null; } },

  drawStatic:function(){ this.draw(this.t0||0, true); },

  draw:function(now, still){
    var cx=this.cx, ts=this.ts;
    if(!cx) return;
    var t=still? 0 : (now-this.t0)/1000;

    cx.drawImage(bakeTile(), 0,0, COLS*ts, ROWS*ts);

    if(!still){
      cx.fillStyle='rgba(255,255,255,.55)';
      for(var s=0;s<SPARK.length;s++){
        var sp=SPARK[s];
        if(Math.sin(t*1.7 + sp[2]*6.283) > 0.86) cx.fillRect(sp[0]*ts, sp[1]*ts, ts, ts);
      }
    }

    var NN=this.nodeCache||nodes(ts), reach=this.reached();

    for(var i=0;i<NN.length-1;i++){
      dots(cx, NN[i], NN[i+1], i<reach);
    }
    NN.forEach(function(nd,i){
      marker(cx, nd, i<reach? 'done' : (i===reach? 'now':'next'), t, still);
    });

    var vp = Math.max(1, ts-1);
    var u = still? 1 : Math.min(1, (t%10)/6.5);
    var pos = along(NN, reach, u);
    NQ.drawSprite(cx,'van',
      Math.round(pos.x - 6*vp), Math.round(pos.y - 11*vp) + (still?0:Math.round(Math.sin(t*3.4)*1.5)),
      vp, pos.dx<0);

    NQ.drawSprite(cx,'flag', NN[NN.length-1].x+5*vp, NN[NN.length-1].y-11*vp, vp);
  },

  click:function(e){
    var r=this.cv.getBoundingClientRect();
    var x=e.clientX-r.left, y=e.clientY-r.top;
    var NN=this.nodeCache||nodes(this.ts), best=null, bd=1e9;
    NN.forEach(function(nd){
      var d=Math.hypot(nd.x-x, nd.y-y);
      if(d<bd){ bd=d; best=nd; }
    });
    if(best && bd<22) NQ.openDay(best.n);
  }
};

function dots(cx,a,b,done){
  var d=Math.hypot(b.x-a.x,b.y-a.y), n=Math.max(1,Math.round(d/6));
  cx.fillStyle = done? 'rgba(245,197,66,.95)' : 'rgba(255,255,255,.34)';
  for(var i=1;i<n;i++){
    var u=i/n;
    cx.fillRect(Math.round(a.x+(b.x-a.x)*u)-1, Math.round(a.y+(b.y-a.y)*u)-1, 2,2);
  }
}

function marker(cx,nd,state,t,still){
  var lbl=String(nd.n), w=lbl.length*6+3, h=11;
  var x=nd.x-Math.round(w/2), y=nd.y-Math.round(h/2);
  var fill,border,ink;

  if(state==='done'){ fill='#2f6340'; border='#7fdb6a'; ink='#e8f6e4'; }
  else if(state==='now'){
    var on = still? 1 : (Math.sin(t*5)>0?1:0);
    fill = on? '#f5c542':'#a8801a'; border='#ffffff'; ink='#1b1b22';
    if(!still){
      cx.fillStyle='rgba(245,197,66,'+(0.22+0.18*Math.sin(t*5))+')';
      cx.fillRect(x-5,y-5,w+10,h+10);
    }
  }
  else { fill='#16283d'; border='#7ba7d4'; ink='#cfe0f0'; }

  cx.fillStyle='rgba(0,0,0,.45)'; cx.fillRect(x-1,y+2,w+4,h+4);   // ombra portata
  cx.fillStyle=border; cx.fillRect(x-2,y-2,w+4,h+4);
  cx.fillStyle=fill;   cx.fillRect(x,y,w,h);
  NQ.drawText(cx,lbl,x+2,y+2,1,ink);

  if(nd.day.trek){
    cx.fillStyle = state==='done'? '#7fdb6a':'#e8544b';
    cx.fillRect(nd.x-1,y-8,3,3);
    cx.fillRect(nd.x-3,y-10,7,2);
  }
}

function along(NN, reach, u){
  if(reach<=0) return { x:NN[0].x, y:NN[0].y, dx:1 };
  var segs=[], tot=0, i;
  for(i=0;i<reach;i++){
    var d=Math.hypot(NN[i+1].x-NN[i].x, NN[i+1].y-NN[i].y);
    segs.push(d); tot+=d;
  }
  var target=tot*u, acc=0;
  for(i=0;i<segs.length;i++){
    if(acc+segs[i]>=target || i===segs.length-1){
      var l=segs[i]? Math.max(0,Math.min(1,(target-acc)/segs[i])) : 1;
      return { x:NN[i].x+(NN[i+1].x-NN[i].x)*l,
               y:NN[i].y+(NN[i+1].y-NN[i].y)*l,
               dx:NN[i+1].x-NN[i].x };
    }
    acc+=segs[i];
  }
  return { x:NN[reach].x, y:NN[reach].y, dx:1 };
}

/* Titolo disegnato con il font bitmap 5x7: è l'unico modo di avere
   lettere davvero pixelate senza caricare un webfont dall'esterno. */
function drawTitle(){
  var cv=$('#titlecv'); if(!cv) return;
  var host=cv.parentElement;
  var avail=Math.max(240, host.clientWidth);
  var px=Math.max(2, Math.min(6, Math.floor(avail/72)));
  var sub='NORVEGIA IN VAN  1-15 AGO 2026';
  var spx=Math.max(1, Math.floor(px/2.5));

  var w=Math.max(NQ.textWidth('NORGE QUEST',px), NQ.textWidth(sub,spx));
  var hh=7*px + px + 12 + 7*spx;

  var dpr=Math.min(3, window.devicePixelRatio||1);
  cv.style.width=w+'px'; cv.style.height=hh+'px';
  cv.width=Math.round(w*dpr); cv.height=Math.round(hh*dpr);
  var cx=cv.getContext('2d');
  cx.setTransform(dpr,0,0,dpr,0,0);
  cx.imageSmoothingEnabled=false;

  NQ.drawText(cx,'NORGE QUEST', Math.round((w-NQ.textWidth('NORGE QUEST',px))/2), 0, px, '#f5c542', '#8a5a12');
  NQ.drawText(cx, sub, Math.round((w-NQ.textWidth(sub,spx))/2), 7*px+px+12, spx, '#7d97b3');
}

NQ.toggleDay=function(n){
  var s=d(), day=dayByN(n);
  /* done[n] resta a false invece di sparire: solo così la fusione sa
     distinguere "l'altro non l'ha ancora fatto" da "l'ho annullato io". */
  NQ.withLevelUp(function(){
    s.done[n] = !s.done[n];
    s.doneTs[n] = Date.now();
    NQ.store.save();
  });
  if(s.done[n]) NQ.toast('Giorno '+n+' completato','+'+day.xp+' XP');
  NQ.checkTrophies();
  NQ.sync.programma();
  NQ.renderHud();

};

         '</label>'+
       '</div>'+
       '<div class="photos" id="jphotos"></div>'+

     '</div>';

       '<p class="small muted">Le foto restano intatte, alla risoluzione con cui le hai scattate. '+
       'L\'album è un archivio .zip con dentro una pagina sfogliabile, le foto originali '+
       'e i dati: si apre ovunque e non ha bisogno di questa app.</p>'+
       '<div class="row">'+
         '<button class="pxbtn go" onclick="NQ.exportZIP()">📦 Scarica l\'album</button>'+
         '<button class="pxbtn" onclick="NQ.exportJSON()">⬇ Solo dati .json</button>'+

       '<div class="row mt">'+
         '<label class="pxbtn" style="cursor:pointer;margin:0;text-transform:uppercase">'+
           '⬆ Ripristina<input type="file" accept=".zip,.json,application/zip,application/json" style="display:none" onchange="NQ.importBackup(event)">'+
         '</label>'+
       '</div>'+

       '(dati e foto) sia il .json (solo dati). Fallo ogni tanto: la memoria del browser '+
